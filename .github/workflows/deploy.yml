name: Deploy to IONOS

on:
  push:
    branches: [main]
    # Nur deployen, wenn sich die App oder der Deploy-Weg ändert. Reine
    # Coaching-Commits (coach/, Doku) lösen kein Deployment aus.
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SFTP_HOST: ${{ secrets.FTP_HOST }}
  SFTP_USER: ${{ secrets.FTP_USERNAME }}
  SFTP_PASS: ${{ secrets.FTP_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy website via SFTP
        run: bash .github/scripts/deploy.sh

      - name: Verify deployment
        id: verify
        continue-on-error: true
        run: bash .github/scripts/verify_live.sh

      # Ab hier nur der Fehlerfall. Der Revert-Push läuft mit dem GITHUB_TOKEN
      # und startet deshalb keinen neuen Workflow — der revertete Stand muss
      # in diesem Lauf selbst wieder auf den Server.
      - name: Revert failed deployment
        id: revert
        if: steps.verify.outcome == 'failure' && !startsWith(github.event.head_commit.message, 'Revert')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit HEAD
          git push origin HEAD:main

      - name: Redeploy reverted state
        id: rollback
        if: steps.revert.outcome == 'success'
        continue-on-error: true
        run: |
          bash .github/scripts/deploy.sh
          bash .github/scripts/verify_live.sh

      - name: Report deployment failure
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::Deployment fehlgeschlagen: Website nicht erreichbar oder Wochen-ID nicht ausgeliefert."
          case "${{ steps.rollback.outcome }}" in
            success) echo "::notice::Der oberste Commit wurde revertet, der vorherige Stand ist wieder live." ;;
            failure) echo "::error::Revert ist gepusht, aber der Rückbau auf dem Server ist fehlgeschlagen. Der Server steht auf einem unklaren Stand — Workflow von Hand neu starten." ;;
            *)       echo "::error::Kein Rückbau erfolgt (Revert-Commit an der Spitze oder Revert fehlgeschlagen). Server von Hand prüfen." ;;
          esac
          exit 1
