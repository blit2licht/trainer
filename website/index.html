<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training · Martin</title>
<meta name="theme-color" content="#1c1a15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root {
  --bg:oklch(97% 0.005 90); --card:oklch(99% 0.003 90); --card-muted:oklch(94% 0.006 90);
  --line:oklch(89% 0.007 90); --line2:oklch(93% 0.005 90);
  --ink:oklch(22% 0.01 90); --ink2:oklch(45% 0.01 90); --ink3:oklch(49% 0.012 90);
  --accent:oklch(45% 0.09 200); --accent-soft:oklch(93% 0.025 200); --accent-ink:oklch(38% 0.1 200); --accent-contrast:#fff;
  --danger:oklch(55% 0.19 25);
  --warn:oklch(52% 0.11 75); --warn-soft:oklch(94% 0.04 75);
  --danger-soft:oklch(95% 0.03 25);
  --disp:'Space Grotesk', system-ui, sans-serif;
  --body:'Inter', system-ui, sans-serif;
  --mono:'JetBrains Mono', monospace;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark) {
:root {
  --bg:oklch(22% 0.015 260); --card:oklch(27% 0.015 260); --card-muted:oklch(19% 0.012 260);
  --line:oklch(34% 0.02 260); --line2:oklch(30% 0.018 260);
  --ink:oklch(96% 0.005 260); --ink2:oklch(75% 0.01 260); --ink3:oklch(70% 0.014 260);
  --accent:oklch(72% 0.16 55); --accent-soft:oklch(34% 0.05 55); --accent-ink:oklch(85% 0.11 55); --accent-contrast:oklch(18% 0.02 60);
  --danger:oklch(68% 0.18 25);
  --warn:oklch(80% 0.13 85); --warn-soft:oklch(32% 0.05 85);
  --danger-soft:oklch(30% 0.06 25);
  --shadow:none;
}
}

html { -webkit-text-size-adjust:100%; }
body { background:var(--bg); color:var(--ink); font-family:var(--body); line-height:1.5; font-size:16px; min-height:100vh; }
.shell { max-width:760px; margin:0 auto; padding:22px 16px 64px; }

/* Sichtbarer Tastaturfokus — global, nie per outline:none entfernt */
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:8px; }
.skip-link { position:absolute; left:-9999px; top:0; background:var(--card); color:var(--ink); padding:12px 16px; border:1.5px solid var(--accent); border-radius:10px; z-index:60; }
.skip-link:focus { left:12px; top:12px; }

.view { display:none; }
.view.active { display:block; animation:fade .22s ease; }
@keyframes fade { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }

/* Top bar */
.topbar { display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
.week-select-wrap { margin-left:auto; position:relative; }
.week-select-label { display:block; font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); margin-bottom:5px; }
select#weekSelect { appearance:none; -webkit-appearance:none; background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:11px; font-family:var(--mono); font-size:13px; font-weight:600; padding:11px 38px 11px 14px; cursor:pointer; transition:border-color .15s; box-shadow:var(--shadow); min-height:44px; }
select#weekSelect:hover { border-color:var(--accent); }
.select-chevron { position:absolute; right:14px; bottom:15px; width:13px; height:13px; pointer-events:none; color:var(--ink3); }

/* Headers */
.page-header { margin-bottom:14px; }
.eyebrow { font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:6px; }
.page-header h1 { font-family:var(--disp); font-size:30px; font-weight:700; color:var(--ink); letter-spacing:-.02em; line-height:1.08; }
.page-header .sub { font-size:14px; color:var(--ink2); margin-top:7px; font-weight:500; }
.detail-sub { font-size:14px; color:var(--ink2); margin:12px 0 26px; line-height:1.55; }

/* Meta-Chips: Dauer und Priorität */
.mchip { display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.01em; padding:2px 7px; border-radius:7px; background:var(--card-muted); border:1px solid var(--line2); color:var(--ink2); white-space:nowrap; }
.mchip.prio-1 { background:var(--accent-soft); border-color:var(--accent-soft); color:var(--accent-ink); }
.mchip.prio-r { background:transparent; }
.mchip.mchip-opt { background:var(--warn-soft); border-color:var(--warn-soft); color:var(--warn); }

/* Day cards */
.days { display:flex; flex-direction:column; gap:12px; }
.day-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 8px 14px; box-shadow:var(--shadow); transition:border-color .12s, opacity .12s; }
.day-card.t-rest { background:var(--card-muted); padding-bottom:10px; }
.day-card.collapsed { opacity:.78; }
.day-card.collapsed:hover, .day-card:focus-within { opacity:1; }
.day-card.is-today { border-color:var(--accent); }

.dc-top { display:flex; align-items:stretch; gap:4px; }
.dc-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; align-items:flex-start; text-align:left; background:none; border:none; padding:10px; border-radius:12px; cursor:pointer; font:inherit; color:inherit; min-height:44px; }
.dc-main-static { cursor:default; }
button.dc-main:hover { background:var(--card-muted); }
.dc-chev { flex:0 0 auto; width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; background:none; border:none; border-radius:12px; cursor:pointer; color:var(--ink3); }
.dc-chev:hover { background:var(--card-muted); color:var(--accent-ink); }
.dc-chev-spacer { flex:0 0 auto; width:44px; }
.dc-chev svg { width:16px; height:16px; transition:transform .15s; }
.dc-chev[aria-expanded="true"] svg { transform:rotate(180deg); }

.dc-line1 { display:flex; align-items:center; gap:10px; width:100%; flex-wrap:wrap; }
.dc-day { font-family:var(--disp); font-size:18px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
.dc-date { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--ink3); }
/* Volle Button-Breite, damit die Gewichte untereinander auf einer Kante stehen.
   Kein negativer Außenabstand: Der würde die Zahlen unter das Chevron schieben. */
.dc-blocks { align-self:stretch; }
.dc-blocks > span { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.dcb-last { font-family:var(--mono); font-size:15px; font-weight:700; color:var(--accent-ink); white-space:nowrap; }
.dc-blocks { display:flex; flex-direction:column; gap:2px; margin-top:3px; font-family:var(--disp); font-size:16px; font-weight:700; color:var(--ink); line-height:1.3; letter-spacing:-.01em; }
.dc-einheit { font-size:16px; font-weight:600; color:var(--ink); }
.dc-metarow { display:flex; flex-wrap:wrap; gap:6px; }
.dc-cta-btn { display:inline-flex; align-items:center; gap:7px; min-height:44px; margin:8px 10px 0; padding:0 14px; background:var(--accent-soft); border:none; border-radius:11px; cursor:pointer; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-ink); }
.dc-cta-btn:hover { background:var(--accent); color:var(--accent-contrast); }
.dc-cta-btn svg { width:13px; height:13px; }

/* Tagestyp: Icon + Label statt Emoji-Badge/Farbbalken */
/* Rechtsbündig mit fester Mindestbreite: dadurch liegen Icon und Label aller
   Tageskarten auf je einer senkrechten Achse, unabhängig davon, wie lang der
   Wochentag oder das Typ-Label ist. 84px deckt das längste Label ab
   („Ruhetag", „Focus B" messen 82,4px) — bei einem längeren Label muss der
   Wert mitwachsen, sonst bricht die Achse. */
.type-badge { margin-left:auto; flex-shrink:0; display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink2); white-space:nowrap; }
.type-icon { width:24px; height:24px; border-radius:8px; background:var(--card-muted); color:var(--ink3); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.type-icon svg { width:14px; height:14px; }
/* Ruhetag-Karte liegt auf --card-muted, dem Standard-Hintergrund des
   Icon-Felds — sonst verschwindet das Feld und die Icon-Achse wirkt lückenhaft. */
.day-card.t-rest .type-icon { background:var(--card); }
.type-badge.focus { color:var(--accent-ink); }
.type-badge.focus .type-icon { background:var(--accent-soft); color:var(--accent-ink); }

.dc-sub { font-size:13px; color:var(--ink2); margin-top:3px; font-weight:500; display:flex; flex-direction:column; gap:2px; }
.dc-rx { margin:2px 10px 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.dc-rx-main { font-family:var(--mono); font-size:15px; font-weight:600; color:var(--ink); line-height:1.45; }
.dc-rx-main .rv { color:var(--accent-ink); font-weight:700; }
.rpe-pill { display:inline-block; background:var(--accent-soft); color:var(--accent-ink); font-family:var(--mono); font-size:12px; font-weight:700; padding:3px 9px; border-radius:7px; white-space:nowrap; }
.dc-note { font-size:13px; color:var(--ink2); margin-top:11px; line-height:1.5; }
.dc-note-rest { margin:0 10px; padding-top:2px; }
.dc-body { padding:0 10px; }

/* Strava stats */
.dc-strava { margin-top:13px; padding-top:12px; border-top:1px solid var(--line2); }
.strava-logo { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); background:var(--card-muted); padding:3px 8px; border-radius:6px; display:inline-block; margin-bottom:10px; }
.dc-strava-grid { display:flex; flex-wrap:wrap; gap:8px; }
.rs-chip { background:var(--card-muted); border:1px solid var(--line2); border-radius:10px; padding:8px 12px; flex:1 1 calc(25% - 6px); min-width:70px; }
.rs-label { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); margin-bottom:3px; }
.rs-val { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--ink); line-height:1.1; }
.rs-unit { font-size:13px; font-weight:500; color:var(--ink3); }

/* Aufklapp-Element (Disclosure) */
.disc { border:1px solid var(--line); border-radius:12px; background:var(--card); overflow:hidden; margin-bottom:8px; }
.disc-btn { display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:11px 14px; background:none; border:none; cursor:pointer; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.02em; color:var(--ink2); text-align:left; }
.disc-btn:hover { color:var(--accent-ink); background:var(--card-muted); }
.disc-chev { display:flex; flex-shrink:0; color:var(--ink3); }
.disc-chev svg { width:14px; height:14px; transition:transform .15s; }
.disc-btn[aria-expanded="true"] .disc-chev svg { transform:rotate(180deg); }
.disc-panel { padding:2px 14px 14px; font-size:13px; color:var(--ink2); line-height:1.55; }
.disc-panel ul { margin:0 0 0 18px; }
.disc-panel li { margin:3px 0; }
.rule-scale { font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.05em; color:var(--ink3); margin-bottom:10px; }
.rule-step { border-left:3px solid var(--line); padding:8px 0 8px 11px; margin-bottom:9px; background:var(--card-muted); border-radius:0 8px 8px 0; }
.rule-step.gelb { border-left-color:var(--warn); }
.rule-step.rot  { border-left-color:var(--danger); }
.rule-step-h { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink); margin-bottom:4px; }
.rule-day { margin-top:7px; padding-top:7px; border-top:1px dashed var(--line); color:var(--ink); }
.rule-day b { font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-ink); display:block; margin-bottom:2px; }
.rule-note { margin-top:8px; }
.rule-src { margin-top:8px; font-family:var(--mono); font-size:13px; color:var(--ink3); }
.rules-head { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); margin:0 0 8px; }
.rules-bar { margin-bottom:18px; }

/* Glossar */
.gloss-item { padding:10px 0; border-bottom:1px solid var(--line2); }
.gloss-item:last-child { border-bottom:none; }
.gloss-term { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink); }
.gloss-def { margin-top:3px; }
.gloss-src { margin-top:4px; font-family:var(--mono); font-size:13px; color:var(--ink3); }
.gloss-wrap { margin-top:22px; }

button.term { font:inherit; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); border:none; border-radius:6px; padding:1px 5px; min-height:24px; cursor:pointer; line-height:1.3; }
button.term:hover { text-decoration:underline; }
/* Die Trefferfläche wächst über ein Overlay statt über die Zeilenhöhe: inline im
   Fließtext würde ein 44px hoher Button den Absatzrhythmus zerreißen. */
button.term { position:relative; }
button.term::after { content:''; position:absolute; inset:-6px -4px; }

.gloss-pop { position:fixed; left:0; right:0; bottom:0; z-index:50; padding:12px; }
.gloss-pop-inner { max-width:736px; margin:0 auto; background:var(--card); border:1.5px solid var(--accent); border-radius:16px; padding:16px 18px; box-shadow:0 6px 30px rgba(16,24,40,.22); }
.gloss-pop-head { display:flex; align-items:flex-start; gap:12px; }
.gloss-pop-head h2 { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ink); flex:1; }
.gloss-close { flex:0 0 auto; width:44px; height:44px; margin:-10px -10px 0 0; display:flex; align-items:center; justify-content:center; background:none; border:none; border-radius:10px; cursor:pointer; color:var(--ink2); }
.gloss-close:hover { background:var(--card-muted); color:var(--accent-ink); }
.gloss-close svg { width:16px; height:16px; }
.gloss-pop p { font-size:14px; color:var(--ink2); line-height:1.55; margin-top:8px; }
.gloss-pop .gloss-pop-src { font-family:var(--mono); font-size:13px; color:var(--ink3); }

/* Notes system */
.note-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding-top:6px; border-top:1px solid var(--line2); }
.note-toggle-btn { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 10px 0 0; font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); background:none; border:none; cursor:pointer; transition:color .15s; }
.note-toggle-btn:hover { color:var(--accent-ink); }
.note-toggle-btn svg { width:13px; height:13px; transition:transform .15s; }
.note-toggle-btn[aria-expanded="true"] svg { transform:rotate(180deg); }
.note-has-indicator { display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:13px; font-weight:600; color:var(--ink2); }
.note-feel-dot { width:9px; height:9px; border-radius:50%; background:var(--accent); }
.note-has-indicator.draft { color:var(--ink3); }
.note-has-indicator.draft .note-feel-dot { background:var(--ink3); }

.note-panel { margin-top:12px; background:var(--card-muted); border:1px solid var(--line2); border-radius:12px; padding:14px; }

.feel-label { font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.06em; color:var(--ink3); margin-bottom:8px; }
.feel-row { display:flex; gap:8px; margin-bottom:12px; }
.feel-btn { flex:1; min-height:44px; border:1.5px solid var(--line); border-radius:10px; background:var(--card); font-family:var(--mono); font-size:15px; font-weight:700; color:var(--ink2); cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; }
.feel-btn:hover { border-color:var(--accent); color:var(--accent-ink); }
.feel-btn[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }

.note-textarea { width:100%; min-height:150px; border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; font-family:var(--body); font-size:14px; color:var(--ink); background:var(--card); resize:vertical; transition:border-color .15s; line-height:1.5; }
.note-textarea:focus { border-color:var(--accent); }
.note-textarea::placeholder { color:var(--ink3); }

.show-all-btn { display:block; width:100%; margin-top:4px; min-height:44px; padding:12px; background:var(--card); border:1.5px dashed var(--line); border-radius:14px; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); cursor:pointer; transition:all .15s; }
.show-all-btn:hover { border-color:var(--accent); color:var(--accent-ink); }

.note-actions { display:flex; align-items:center; gap:12px; margin-top:10px; }
.note-save-btn { min-height:44px; padding:0 18px; background:var(--accent); color:var(--accent-contrast); border:none; border-radius:9px; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.05em; cursor:pointer; transition:opacity .15s; }
.note-save-btn:hover { opacity:.85; }
.note-save-btn:disabled { background:var(--ink3); cursor:not-allowed; }
.note-status { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--ink2); }
.note-status.err { color:var(--danger); }

/* Detail nav */
.nav-back { display:inline-flex; align-items:center; gap:7px; cursor:pointer; color:var(--ink2); font-family:var(--mono); font-size:12px; font-weight:600; padding:11px 15px; background:var(--card); border:1.5px solid var(--line); border-radius:11px; margin-bottom:20px; transition:all .14s; min-height:44px; box-shadow:var(--shadow); }
.nav-back:hover { color:var(--accent-ink); border-color:var(--accent); }
.nav-back svg { width:14px; height:14px; }
.crumb { font-family:var(--mono); font-size:12px; color:var(--ink3); margin-bottom:18px; font-weight:600; display:flex; align-items:center; flex-wrap:wrap; }
.crumb .lnk { font:inherit; color:var(--accent-ink); background:none; border:none; cursor:pointer; min-height:44px; padding:0 4px 0 0; }
.crumb .lnk:hover { text-decoration:underline; }
.crumb .sep { margin:0 7px; color:var(--ink3); }

/* Routinen-Kopf */
.routine-meta { display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 8px; }
.routine-meta-note { font-family:var(--mono); font-size:13px; color:var(--ink3); line-height:1.6; margin-bottom:14px; }

/* Focus blocks */
/* Blöcke sind aufklappbar: geschlossen trägt der Kopf schon Buchstabe, Titel und
   die Arbeitszahlen der ersten Zeile. Genau ein Block ist offen — der Fokus-Tag
   ist eine Anleitung für einen Ablauf, kein Dokument zum Durchlesen. */
.blk { margin-bottom:10px; border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden; }
.blk.is-optional { border-style:dashed; }
.blk-head { display:flex; align-items:center; gap:11px; width:100%; min-height:56px; padding:10px 14px; background:none; border:none; cursor:pointer; text-align:left; }
.blk-head:hover { background:var(--card-muted); }
.blk-letter { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--accent-contrast); background:var(--accent); width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.blk-letter svg { width:16px; height:16px; }
.blk.is-optional .blk-letter { background:var(--ink3); }
.blk.is-done .blk-letter { background:var(--ink3); }
.blk-headtext { flex:1; min-width:0; }
.blk-title { font-family:var(--disp); font-size:16px; font-weight:700; color:var(--ink); letter-spacing:-.01em; display:block; }
.blk.is-done .blk-title { color:var(--ink3); }
/* Arbeitszahlen der ersten Zeile — nur im geschlossenen Zustand, offen zeigt sie der Körper. */
.blk-peek { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--accent-ink); margin-top:2px; display:block; }
.blk.is-open .blk-peek { display:none; }
.blk.is-done .blk-peek { color:var(--ink3); }
.blk-chev { display:flex; flex-shrink:0; color:var(--ink3); }
.blk-chev svg { width:14px; height:14px; transition:transform .15s cubic-bezier(.2,.7,.3,1); }
.blk-head[aria-expanded="true"] .blk-chev svg { transform:rotate(180deg); }
.blk-body { padding:0 14px 14px; }
.blk-sub { font-family:var(--mono); font-size:12px; font-weight:500; color:var(--ink2); margin:0 0 11px; }
.blk-flags { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:11px; }
/* Übungsnotiz: benannter Griff statt „Mehr" — der Text ist weg, die Zahlen stehen. */
.exc-note-wrap { margin-top:11px; }
.dc-note-wrap { margin-top:6px; }
.dc-note-wrap-rest { margin:0 10px 4px; }
.dc-note-wrap .dc-note { margin-top:2px; }
.exc-note-btn { display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:0 4px 0 0; background:none; border:none; cursor:pointer; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); }
.exc-note-btn:hover { color:var(--accent-ink); }
.exc-note-btn svg { width:13px; height:13px; transition:transform .15s; }
.exc-note-btn[aria-expanded="true"] svg { transform:rotate(180deg); }
.note-has-indicator.offen { color:var(--warn); }
.note-has-indicator.offen .note-feel-dot { background:var(--warn); }
.blk-done { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:44px; margin-top:12px; padding:0 14px; background:var(--card-muted); border:1px solid var(--line); border-radius:11px; cursor:pointer; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); }
.blk-done:hover { color:var(--accent-ink); border-color:var(--accent-soft); background:var(--accent-soft); }
.blk-done svg { width:15px; height:15px; }
.blk.is-done .blk-done { color:var(--accent-ink); background:var(--accent-soft); border-color:var(--accent-soft); }
.exc { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 16px; box-shadow:var(--shadow); margin-bottom:10px; }
.exc-name { font-family:var(--disp); font-size:18px; font-weight:700; color:var(--ink); letter-spacing:-.01em; line-height:1.2; }
.exc-name small { display:block; font-family:var(--body); font-size:13px; font-weight:500; color:var(--ink3); margin-top:2px; }
.exc-data { display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px; margin-top:13px; }
.chip { background:var(--card-muted); border:1px solid var(--line2); border-radius:10px; padding:8px 12px; min-width:74px; }
.chip-label { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); margin-bottom:3px; }
.chip-val { font-family:var(--mono); font-size:17px; font-weight:700; color:var(--ink); line-height:1.15; }
/* Lasttreppen ab drei Stufen stehen untereinander: ein Wert pro Zeile liest
   sich von oben nach unten, statt mitten in der Sequenz umzubrechen. */
.chip-val .steps > span { display:block; }
.chip-val .steps > span.op { color:var(--ink3); font-weight:500; }
.chip-val .steps > span + span { margin-top:1px; }
.chip-val small { display:block; font-size:13px; font-weight:500; color:var(--ink3); margin-top:2px; letter-spacing:0; }
.exc-meta { display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; font-family:var(--mono); font-size:12px; font-weight:500; color:var(--ink2); }
.exc-meta b { color:var(--ink3); font-weight:600; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-right:5px; }
.exc-note { font-size:13px; color:var(--ink2); margin-top:12px; line-height:1.55; padding-top:11px; border-top:1px solid var(--line2); }
.blk-note { margin-top:11px; padding:12px 14px; background:var(--accent-soft); border-radius:12px; font-size:13px; color:var(--accent-ink); line-height:1.55; font-weight:500; }
/* WOD-Block: Struktur, Reps, Lasten und Zeitlimit zusammen sichtbar, gleiche Schriftgröße für Reps/Move/Detail — keine Prioritäts-Hierarchie */
/* Auf der Tageskarte können mehrere WODs direkt aufeinander folgen (Kraftteil +
   Metcon) und der erste stößt sonst an die Lastzeile darüber. Im Fokus-Tag steht
   je Block nur einer, dort tragen die Elemente davor ihren eigenen Abstand. */
.dc-body .wod { margin-top:12px; }
.wod { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
.wod-struct { font-family:var(--disp); font-size:21px; font-weight:700; color:var(--ink); letter-spacing:-.015em; line-height:1.2; }
.wod-tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:11px; }
.wod-tag { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:5px 10px; border-radius:8px; background:var(--card-muted); color:var(--ink2); }
.wod-tag.cap { background:var(--accent-soft); color:var(--accent-ink); }
.wod-tag.level { background:var(--accent-soft); color:var(--accent-ink); }
.dc-einheit-rx { font-family:var(--mono); font-size:15px; font-weight:600; color:var(--accent-ink); margin-left:9px; }
.wod-lines { margin-top:15px; border-top:1px solid var(--line2); }
.wod-line { display:flex; align-items:baseline; gap:13px; padding:12px 0; border-bottom:1px solid var(--line2); }
.wod-line:last-child { border-bottom:none; padding-bottom:2px; }
.wod-reps { font-family:var(--mono); font-size:15px; font-weight:700; color:var(--ink); min-width:40px; flex-shrink:0; line-height:1.3; }
.wod-move { font-family:var(--disp); font-size:15px; font-weight:600; color:var(--ink); flex:1; line-height:1.3; }
.wod-detail { font-family:var(--mono); font-size:15px; font-weight:600; color:var(--ink2); text-align:right; flex-shrink:0; white-space:nowrap; }
.wod-total { margin-top:13px; padding-top:12px; border-top:1px solid var(--line2); font-family:var(--mono); font-size:12px; font-weight:500; color:var(--ink3); line-height:1.5; }
@media (max-width:420px){
  .wod-line { flex-wrap:wrap; gap:0 13px; }
  .wod-detail { width:100%; text-align:left; margin-top:3px; padding-left:53px; }
}

/* WHOOP: kopierbarer Textblock statt Karte mit Listen-Items */
.whoop-copy { margin-top:30px; background:var(--card-muted); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
.whoop-copy-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.whoop-copy-title { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); }
.copy-btn { display:inline-flex; align-items:center; gap:6px; min-height:44px; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink2); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
.copy-btn:hover { border-color:var(--accent); color:var(--accent-ink); }
.copy-btn svg { width:13px; height:13px; }
.whoop-text { font-family:var(--mono); font-size:13px; color:var(--ink); line-height:1.75; white-space:pre-wrap; }

.empty { padding:48px; text-align:center; color:var(--ink3); }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

@media (max-width:480px){
  .shell { padding:18px 13px 56px; }
  .page-header h1 { font-size:26px; }
  .chip { flex:1 1 calc(50% - 4px); min-width:0; }
  .rs-chip { flex:1 1 calc(50% - 4px); min-width:0; }
  .note-textarea { min-height:160px; }
}

<body>
<a class="skip-link" href="#main">Zum Inhalt springen</a>
<div class="shell">

  <div id="view-week" class="view active">
    <div class="topbar">
      <div class="week-select-wrap">
        <label class="week-select-label" for="weekSelect">Woche wählen</label>
        <select id="weekSelect" onchange="onWeekChange()"></select>
        <svg class="select-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
      </div>
    </div>
    <main id="main"><div id="weekContent"></div></main>
  </div>

  <div id="view-focus" class="view">
    <button type="button" class="nav-back" onclick="showWeek()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
      Zurück zum Wochenplan
    </button>
    <div id="focusContent"></div>
  </div>

</div>

<div id="glossPop" class="gloss-pop" role="dialog" aria-labelledby="glossTitle" hidden>
  <div class="gloss-pop-inner">
    <div class="gloss-pop-head">
      <h2 id="glossTitle"></h2>
      <button type="button" class="gloss-close" id="glossClose" aria-label="Erklärung schließen" onclick="closeTerm()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <p id="glossDef"></p>
    <p class="gloss-pop-src" id="glossSrc"></p>
  </div>
</div>

<script src="data.js"></script>
<script>

/* Glossar-Begriffe, die im Fließtext als echte Buttons verlinkt werden.
   Reihenfolge = Matching-Priorität (längste/spezifischste zuerst). */
const GLOSS_RE = /(Sonntagslast-Regel|Session-Feel|RPE-gated|E2:15|Ceiling|\bL[23]\b)/g;

function attr(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function escapeHtml(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

/* rich(): verlinkt Glossarbegriffe (und optional Abkürzungen) in bereits
   gerendertem HTML. Ersetzt nur Textsegmente außerhalb von Tags und schützt
   fertige Term-Buttons per Platzhalter, damit keine Buttons ineinander landen. */
function outsideTags(html, fn){
  return String(html).split(/(<[^>]*>)/).map(seg => seg.charAt(0) === '<' ? seg : fn(seg)).join('');
}
function rich(html, opts){
  if (html === undefined || html === null) return '';
  const store = [];
  let s = outsideTags(html, seg => seg.replace(GLOSS_RE, m => {
    if (!DATA.glossar[m]) return m;
    store.push('<button type="button" class="term" data-term="' + attr(m) +
      '" aria-label="' + attr(m + ' — Erklärung anzeigen') + '" onclick="openTerm(this)">' + escapeHtml(m) + '</button>');
    return '\u0001' + (store.length - 1) + '\u0001';
  }));
  return s.replace(/\u0001(\d+)\u0001/g, (_, i) => store[i]);
}
/* Historischer Alias: Abkürzungs-Buttons gibt es nicht mehr, rich() und richW()
   sind identisch. Bleibt bestehen, damit die Aufrufstellen unverändert lesen. */
function richW(html){ return rich(html); }


/* Glossar-Sheet */
let lastTermBtn = null;
function openTerm(btn){
  const g = DATA.glossar[btn.dataset.term];
  if (!g) return;
  lastTermBtn = btn;
  document.getElementById('glossTitle').textContent = g.term;
  document.getElementById('glossDef').textContent   = g.def;
  document.getElementById('glossSrc').textContent   = 'Quelle: ' + g.quelle;
  document.getElementById('glossPop').hidden = false;
  document.getElementById('glossClose').focus();
}
function closeTerm(){
  const pop = document.getElementById('glossPop');
  if (pop.hidden) return;
  pop.hidden = true;
  if (lastTermBtn) { lastTermBtn.focus(); lastTermBtn = null; }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTerm(); });

/* State */
let currentWeekId = null;
let currentFocusKey = null;
let weekNotes = {};
let selectedFeel = {};

/* Icons — geometrisches Icon-System statt Emoji */
const ICON = {
  box:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6.5" cy="12" r="4.2"/><circle cx="17.5" cy="12" r="4.2"/><rect x="10.6" y="10.1" width="2.8" height="2.8" transform="rotate(45 12 11.5)"/></svg>',
  own:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="2.4" rx="1"/><rect x="3" y="8" width="3.4" height="8" rx="1"/><rect x="17.6" y="8" width="3.4" height="8" rx="1"/></svg>',
  rest: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ride: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-6 3 11 2-7 2 2h5"/></svg>'
};
const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const CHEV_DOWN  = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 5"/></svg>';
const CHEV_RIGHT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';

/* Session-Feel: wie die Einheit lief, 1 = mies bis 5 = stark. Nummerierte
   Pills statt Emoji — Bedeutung/Skala unverändert, nur die Darstellung. */
const FEEL_LABEL = ['','Mies','Zäh','Okay','Gut','Stark'];

/* Type config — nur Darstellung. Die Beschriftung kommt aus
   DATA.regeln.prio[type].typ, damit ein Tagestyp genau einen Namen hat. */
const TYPE = {
  rest: { cls:'t-rest', icon:'rest' },
  box:  { cls:'',       icon:'box'  },
  own:  { cls:'',       icon:'own'  },
  ride: { cls:'',       icon:'ride' }
};

/* Helpers */
function splitMain(val){
  const p = String(val).split('||');
  return p.length===1 ? p[0] : `${p[0]}<small>${p.slice(1).join(' ')}</small>`;
}
/* Ab drei Stufen ein Wert pro Zeile (Martin, 20.08.): ein Umbruch mitten in
   „47,5 → 50 →" ist schlechter lesbar als eine saubere Spalte. */
function stackSteps(val){
  const p = String(val).split('||');
  /* Treppen (·/→) und Verkettungen (+) stehen untereinander. Beim Plus bleibt
     der Operator als eigene Zeile sichtbar — sonst liest sich „2 × 3 / 2 × 3"
     wie zwei getrennte Angaben statt wie eine Summe. */
  const plus = p[0].split(/\s*\+\s*/).filter(Boolean);
  let steps, head;
  if (plus.length >= 2) {
    const teile = [];
    plus.forEach((x,i) => { if (i) teile.push('<span class="op">+</span>'); teile.push(`<span>${x}</span>`); });
    head = `<span class="steps">${teile.join('\n')}</span>`;
  } else {
    steps = p[0].split(/\s*(?:→|·)\s*/).filter(Boolean);
    head = steps.length >= 3
      ? `<span class="steps">${steps.map(x=>`<span>${x}</span>`).join('\n')}</span>`
      : p[0];
  }
  return p.length===1 ? head : `${head}<small>${p.slice(1).join(' ')}</small>`;
}
function renderSub(sub){
  if (!sub) return '';
  const blocks = sub.includes('→') ? sub.split('→') : sub.split('·');
  return `<div class="dc-sub">${blocks.map(b=>`<div>${richW(b.trim())}</div>`).join('')}</div>`;
}
/* f.intro ist vertrautes HTML fürs Rendering (<em>, &amp; als Entity) — für
   den WHOOP-Klartextblock erst zu reinem Text auflösen, sonst landen rohe
   Tags/Entities im Copy-Text und auf dem Bildschirm. */
function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || '';
}
function field(headers, row, matchers){
  for(let i=0;i<headers.length;i++) if(matchers.some(m=>headers[i].toLowerCase().includes(m))) return row[i];
  return null;
}
function getWeek(id){ return DATA.weeks.find(w=>w.id===id); }
function todayLocal(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function currentWeek(){
  const t = todayLocal();
  return DATA.weeks.find(w => w.dateFrom <= t && t <= w.dateTo) || DATA.weeks[0];
}

/* ── Aufklapp-Elemente (Disclosure) ── */
function discHTML(id, label, inner){
  return `<div class="disc">
    <button type="button" class="disc-btn" id="${id}-btn" aria-expanded="false" aria-controls="${id}" onclick="toggleDisc('${id}')">
      <span class="disc-chev">${CHEV_DOWN}</span><span>${label}</span>
    </button>
    <div class="disc-panel" id="${id}" hidden>${inner}</div>
  </div>`;
}
function toggleDisc(id){
  const panel = document.getElementById(id), btn = document.getElementById(id + '-btn');
  if (!panel || !btn) return;
  const open = panel.hidden;
  panel.hidden = !open;
  btn.setAttribute('aria-expanded', String(open));
}

/* ── Regeln: Recovery-Anpassung und Ausfall-Regel ── */
function recoveryPanelHTML(day){
  const r = DATA.regeln.recovery;
  const keyFor = { gelb:'u50', rot:'u34' };
  const stufen = r.stufen.map(s => {
    const dayText = day && day[keyFor[s.ton]];
    return `<div class="rule-step ${s.ton}">
      <div class="rule-step-h">${s.schwelle}</div>
      <ul>${s.punkte.map(p=>`<li>${richW(p)}</li>`).join('')}</ul>
      ${dayText ? `<div class="rule-day"><b>Für diese Einheit konkret</b>${richW(dayText)}</div>` : ''}
    </div>`;
  }).join('');
  return `<p class="rule-scale">${r.skala}</p>${stufen}
    <p class="rule-note">${r.geltung}</p>
    <p class="rule-src">Quelle: ${r.quelle}</p>`;
}
function ausfallPanelHTML(){
  const a = DATA.regeln.ausfall;
  return `<ul>${a.punkte.map(p=>`<li>${richW(p)}</li>`).join('')}</ul>
    <p class="rule-note">${richW(a.innerhalb)}</p>
    <p class="rule-src">Quelle: ${a.quelle}</p>`;
}

/* ── Glossar-Panel: nur Begriffe, die auf dieser Seite wirklich vorkommen ── */
function fillGlossary(scopeId, hostId){
  const scope = document.getElementById(scopeId), host = document.getElementById(hostId);
  if (!scope || !host) return;
  const keys = [...new Set([...scope.querySelectorAll('button.term[data-term]')].map(b => b.dataset.term))]
    .filter(k => DATA.glossar[k]);
  if (!keys.length) { host.innerHTML = ''; return; }
  const items = keys.map(k => {
    const g = DATA.glossar[k];
    return `<div class="gloss-item">
      <div class="gloss-term">${escapeHtml(g.term)}</div>
      <div class="gloss-def">${escapeHtml(g.def)}</div>
      <div class="gloss-src">Quelle: ${escapeHtml(g.quelle)}</div>
    </div>`;
  }).join('');
  host.innerHTML = discHTML('gloss-' + scopeId,
    `Glossar — ${keys.length} ${keys.length === 1 ? 'Begriff' : 'Begriffe'} auf dieser Seite`, items);
}

/* Notiz-Drafts (localStorage) */
/* Ein Tag kann zwei Notiz-Instanzen im DOM haben (Wochenansicht + Fokus-Tag).
   Gelesen wird aus der sichtbaren Ansicht, geschrieben in beide — sonst zeigen
   die zwei Instanzen denselben Tag mit verschiedenem Inhalt. */
function noteRead(attrName, date){
  const sel = `[${attrName}="${date}"]`;
  const active = document.querySelector('.view.active');
  return (active && active.querySelector(sel)) || document.querySelector(sel);
}
function noteAll(attrName, date){
  return document.querySelectorAll(`[${attrName}="${date}"]`);
}
function draftKey(d){ return 'note-draft-' + d; }
function loadDraft(d){
  try {
    const raw = JSON.parse(localStorage.getItem(draftKey(d)));
    if (!raw) return null;
    return { feel: raw.feel ?? raw.rpe ?? 0, text: raw.text || '' };
  } catch(e){ return null; }
}
function saveDraft(d){
  const text = noteRead('data-note-text', d)?.value || '';
  const feel = selectedFeel[d] || 0;
  noteAll('data-note-text', d).forEach(ta => { if (ta.value !== text) ta.value = text; });
  try {
    if (text || feel) localStorage.setItem(draftKey(d), JSON.stringify({ feel, text }));
    else localStorage.removeItem(draftKey(d));
  } catch(e){}
  patchNoteIndicator(d);
}
function clearDraft(d){
  try { localStorage.removeItem(draftKey(d)); } catch(e){}
}
function restoreDraft(d){
  const draft = loadDraft(d);
  if (!draft) return;
  if (draft.text) noteAll('data-note-text', d).forEach(ta => { ta.value = draft.text; });
  if (draft.feel > 0) {
    selectedFeel[d] = draft.feel;
    markFeel(d, draft.feel);
  }
  patchNoteIndicator(d);
}
function markFeel(isoDate, val){
  document.querySelectorAll(`[data-feel-date="${isoDate}"]`).forEach(btn =>
    btn.setAttribute('aria-pressed', String(parseInt(btn.dataset.feelVal) === val)));
}

/* Notes API */
async function loadNotes(fromDate, toDate){
  try {
    const r = await fetch(`/get_notes.php?from=${fromDate}&to=${toDate}`);
    if (!r.ok) return;
    const d = await r.json();
    weekNotes = {};
    (d.notes || []).forEach(n => {
      weekNotes[n.note_date] = {
        session_feel: parseInt(n.session_feel ?? n.rpe_feel) || 0,
        note_text: n.note_text,
        blocks_done: n.blocks_done || ''
      };
    });
    patchAllNoteUIs();
  } catch(e) { console.warn('Notes load failed', e); }
}

async function saveNote(isoDate){
  const btn  = noteRead('data-note-save', isoDate);
  const stat = noteRead('data-note-stat', isoDate);
  const text = noteRead('data-note-text', isoDate)?.value || '';
  const feel = selectedFeel[isoDate] || 0;
  if (!btn || !stat) return;

  btn.disabled = true;
  btn.textContent = '…';

  try {
    const r = await fetch('/save_note.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_key: isoDate, note_date: isoDate, session_feel: feel, note_text: text })
    });
    if (r.ok) {
      weekNotes[isoDate] = { session_feel: feel, note_text: text };
      clearDraft(isoDate);
      stat.textContent = 'Gespeichert';
      stat.className = 'note-status';
      patchNoteIndicator(isoDate);
    } else {
      stat.textContent = 'Fehler — Entwurf bleibt lokal';
      stat.className = 'note-status err';
    }
  } catch(e) {
    stat.textContent = 'Offline — Entwurf bleibt lokal';
    stat.className = 'note-status err';
  }

  btn.disabled = false;
  btn.textContent = 'Speichern';
  setTimeout(() => { if(stat) stat.textContent = ''; }, 3000);
}

/* Note UI patches */
function patchAllNoteUIs(){
  Object.entries(weekNotes).forEach(([date, note]) => patchNoteUI(date, note));
  /* Danach alle übrigen Tage der Woche nachziehen, damit fehlende Rückmeldung
     sichtbar wird und nicht als Leerstelle durchgeht. */
  const w = getWeek(currentWeekId);
  if (w) w.days.forEach(d => { if (!weekNotes[d.isoDate]) patchNoteIndicator(d.isoDate); });
}

function patchNoteUI(date, note){
  if (!note) { patchNoteIndicator(date); return; }
  const draft = loadDraft(date);
  if (note.note_text && !(draft && draft.text))
    noteAll('data-note-text', date).forEach(ta => { ta.value = note.note_text; });
  if (note.session_feel > 0 && !(draft && draft.feel > 0)) {
    selectedFeel[date] = note.session_feel;
    markFeel(date, note.session_feel);
  }
  patchNoteIndicator(date);
}

function patchNoteIndicator(date){
  const inds = noteAll('data-note-ind', date);
  if (!inds.length) return;
  const note = weekNotes[date];
  const draft = loadDraft(date);
  const draftDiffers = draft &&
    (draft.text !== ((note && note.note_text) || '') || draft.feel !== ((note && note.session_feel) || 0));
  let html = '';
  /* Schweigen darf nicht als Planerfüllung gelesen werden: Ein vergangener
     Trainingstag ohne jede Rückmeldung wird ausdrücklich als offen markiert. */
  const hasFeedback = (note && (note.session_feel > 0 || note.note_text || note.blocks_done)) || draft;
  const day = (getWeek(currentWeekId)?.days || []).find(x => x.isoDate === date);
  const istVergangen = date < todayLocal();
  const warTraining = day && day.type !== 'rest';
  if (!hasFeedback && istVergangen && warTraining) {
    noteAll('data-note-ind', date).forEach(ind => {
      ind.innerHTML = `<span class="note-has-indicator offen"><span class="note-feel-dot"></span>Keine Rückmeldung</span>`; });
    return;
  }
  if (draftDiffers) {
    html = `<span class="note-has-indicator draft"><span class="note-feel-dot"></span>Entwurf</span>`;
  } else if (note && (note.session_feel > 0 || note.note_text)) {
    const feel = note.session_feel > 0 ? `${note.session_feel} · ` : '';
    html = `<span class="note-has-indicator"><span class="note-feel-dot"></span>${feel}Notiz gespeichert</span>`;
  }
  inds.forEach(ind => { ind.innerHTML = html; });
}

   `sc` trennt die beiden Instanzen desselben Tages: die Notiz steht sowohl auf der
   Tageskarte der Wochenansicht als auch am Ende des Fokus-Tags. IDs müssen eindeutig
   bleiben, damit `for` und `aria-controls` auf das richtige Element zeigen; die
   Zugriffe laufen deshalb über die data-Attribute, nicht über die IDs. */

    <div class="note-bar">

    <div class="note-panel" id="${sc}np-${isoDate}" hidden>
      <div class="feel-label">${richW('Session-Feel')} — wie lief die Einheit?</div>
      <div class="feel-row">${feelButtons}</div>
      <label class="sr-only" for="${sc}ntext-${isoDate}">Notiz zur Einheit</label>
      <textarea class="note-textarea" id="${sc}ntext-${isoDate}" data-note-text="${isoDate}"
                oninput="saveDraft('${isoDate}')"
                placeholder="Was lief gut / schlecht? Lasten, Energie, Technik…"></textarea>
      <div class="note-actions">
        <button type="button" class="note-save-btn" data-note-save="${isoDate}"
                onclick="saveNote('${isoDate}')">Speichern</button>

/* Priorität eines Tages — abgeleitet aus der Ausfall-Regel
   („Fokus-Tage vor Box vor Radfahrt"), nicht pro Tag gepflegt. */
function prioOf(type){ return DATA.regeln.prio[type] || DATA.regeln.prio.rest; }

function dayCardHTML(d, w, today){
  const t = TYPE[d.type];
  const isFocus = d.type === 'own';
  const f = isFocus && w.focusDays ? w.focusDays[d.focus] : null;
  const prio = prioOf(d.type);
  const label = isFocus ? `${prio.typ} ${d.focus}` : prio.typ;
  /* Nur das Icon: Der Typ ist an Form und Farbe erkennbar, der Name kostete eine
     ganze Textspalte. Für Screenreader bleibt er als sr-only erhalten. */
  const badge = `<span class="type-badge${isFocus?' focus':''}"><span class="type-icon">${ICON[t.icon]}</span><span class="sr-only">${label}</span></span>`;
  const dayName = `${d.day}, ${d.date}`;
  const isToday = d.isoDate === today;

  const chips = [`<span class="mchip prio-${prio.rang || 'r'}">${prio.chip}</span>`];
  if (f && f.dauer) {
    /* Eine Pille statt zwei: Kernzeit bis Gesamtdauer als Spanne — das ist die
       Frage, die am Morgen zählt („wie lange muss ich einplanen"). */
    const zahl = v => (String(v).match(/[\d,.]+/) || [''])[0];
    const kern = zahl(f.dauer.kern), ges = zahl(f.dauer.gesamt);
    const spanne = kern && ges && kern !== ges ? `${kern}–${ges}` : (ges || kern);
    if (spanne) chips.push(`<span class="mchip">T ${spanne} min</span>`);
  }
  const line1 = `<span class="dc-line1"><span class="dc-day">${d.day}</span><span class="dc-date">${d.date}</span>${badge}</span>`;
  const metaRow = `<span class="dc-metarow">${chips.join('')}</span>`;

  /* Ruhetag: harte Entscheidung, keine Interaktion, Begründung sofort sichtbar */
  if (d.type === 'rest') {
    const unit = (d.einheit && d.einheit !== '—') ? `<span class="dc-einheit">${d.einheit}</span>` : '';
    /* Platzhalter statt Chevron: hält die Badge-Spalte auf derselben
       senkrechten Achse wie bei den aufklappbaren Karten. */
    return `<article class="day-card t-rest${isToday?' is-today':''}" id="dc-${d.isoDate}">
      <div class="dc-top"><div class="dc-main dc-main-static">${line1}${unit}</div><span class="dc-chev-spacer" aria-hidden="true"></span></div>
      ${d.note ? `<div class="dc-note-wrap dc-note-wrap-rest">
        <button type="button" class="exc-note-btn" id="dn-${d.isoDate}-btn" aria-expanded="false" aria-controls="dn-${d.isoDate}"
                onclick="toggleDayNote('${d.isoDate}')">${CHEV_DOWN}Warum so</button>
        <div class="dc-note dc-note-rest" id="dn-${d.isoDate}" hidden>${richW(d.note)}</div>
      </div>` : ''}
    </article>`;
  }

  /* Fokus-Tage zeigen ihre Kernblöcke als Liste statt einer langen Überschrift.
     `kurz` ist die gepflegte Kurzform; fehlt sie, wird der Titel entklammert. */
  const kernListe = f && f.blocks
    ? f.blocks.filter(b => b.prio !== 'optional').map(b => ({
        name: b.kurz || stripHtml(b.title).replace(/\s*\([^)]*\)/g,'').trim(),
        last: blockTopLoad(b)
      }))
    : [];
  /* Tage mit `wod` tragen keine Einheiten-Überschrift: Sie zählt genau die
     Bewegungen auf, die direkt darunter strukturiert stehen. */
  const einheitHTML = kernListe.length
    ? `<span class="dc-blocks">${kernListe.map(k=>
        `<span><span class="dcb-name">${escapeHtml(k.name)}</span>${k.last?`<span class="dcb-last">${escapeHtml(k.last)}</span>`:''}</span>`).join('')}</span>`
    : (d.wod ? '' : `<span class="dc-einheit">${d.einheit}${
        d.rx && d.rx !== '—' ? `<span class="dc-einheit-rx">${richW(d.rx)}</span>` : ''}</span>`);
  const mainInner = `${line1}${einheitHTML}${metaRow}`;

  const main = isFocus
    ? `<button type="button" class="dc-main" id="dcm-${d.isoDate}" data-role="open"
         aria-label="${attr(dayName + ' — Routine öffnen: Focus-Tag ' + d.focus + ', ' + (f ? f.sub : d.einheit))}"
         onclick="showFocus('${d.focus}')">${mainInner}</button>`
    : `<button type="button" class="dc-main" id="dcm-${d.isoDate}" data-role="toggle"
         aria-expanded="false" aria-controls="dcb-${d.isoDate}"
         aria-label="${attr(dayName + ' — ' + d.einheit + ': Details ein- oder ausblenden')}"
         onclick="toggleDay('${d.isoDate}')">${mainInner}</button>`;

  const chev = `<button type="button" class="dc-chev" id="dch-${d.isoDate}" data-day-label="${attr(dayName)}"
      aria-expanded="false" aria-controls="dcb-${d.isoDate}" aria-label="${attr(dayName + ' aufklappen')}"
      onclick="toggleDay('${d.isoDate}')">${CHEV_DOWN}</button>`;

  /* Lastangaben stehen außerhalb des Karten-Buttons: sie tragen
     Glossar-Buttons und dürfen deshalb nicht in einem Button verschachtelt
     sein. Sie bleiben immer sichtbar, auch bei zugeklappter Karte. */
  /* Die separate Lastzeile ist abgeschafft: Ihr Inhalt steht dort, wo er gilt —
     bei Fokus-Tagen in der Blockliste, bei WOD-Tagen als Kennzeichnung im
     jeweiligen Block, bei Ride-Tagen direkt neben der Einheit. */
  const rx = '';

  /* Der Aufruf steht bewusst unter den Lastangaben: erst die Zahlen, dann der
     Weg in die Routine. Zweiter Zugang zur selben Aktion wie der Kartenkopf. */
  const cta = isFocus
    ? `<button type="button" class="dc-cta-btn"
         aria-label="${attr('Routine öffnen: Focus-Tag ' + d.focus + ' am ' + dayName)}"
         onclick="showFocus('${d.focus}')">Routine öffnen ${CHEV_RIGHT}</button>`
    : '';

  const strava = (d.type==='ride' && d.strava) ? renderStravaStats(d.strava) : '';
  /* Box-Tage tragen ihre Struktur als `wod`-Objekt, nicht als Fließtext —
     dieselbe Darstellung wie im Fokus-Tag. Fehlt sie, bleibt der Untertitel. */
  const wods = d.wod ? (Array.isArray(d.wod) ? d.wod : [d.wod]).map(renderWod).join('') : '';
  /* Die Begründung des Coachs liegt hinter demselben Griff wie im Fokus-Tag.
     Erhalten, aber nicht im Weg — sie wird beim Durchscrollen nicht gelesen. */
  const noteBlock = d.note ? `<div class="dc-note-wrap">
      <button type="button" class="exc-note-btn" id="dn-${d.isoDate}-btn" aria-expanded="false" aria-controls="dn-${d.isoDate}"
              onclick="toggleDayNote('${d.isoDate}')">${CHEV_DOWN}Warum so</button>
      <div class="dc-note" id="dn-${d.isoDate}" hidden>${richW(d.note)}</div>
    </div>` : '';
  /* Fokus-Tage: `sub` wiederholt die Blockliste im Kartenkopf. */
  const body = `<div class="dc-body" id="dcb-${d.isoDate}" hidden>
      ${wods || (kernListe.length ? '' : renderSub(d.sub))}
      ${noteBlock}
      ${strava}
      ${buildNoteHTML(d.isoDate, d.type)}
    </div>`;

  return `<article class="day-card ${t.cls}${isToday?' is-today':''}" id="dc-${d.isoDate}" data-expandable="1">
    <div class="dc-top">${main}${chev}</div>${rx}${cta}${body}</article>`;
}

function renderWeek(){
  const w = getWeek(currentWeekId);
  if(!w){ document.getElementById('weekContent').innerHTML='<div class="empty">Keine Daten.</div>'; return; }

  selectedFeel = {};
  const today = todayLocal();
  const cards = w.days.map(d => dayCardHTML(d, w, today)).join('');

  /* Kein Seitenkopf: Die Wochenauswahl darüber nennt Woche und Zeitraum bereits,
     Phase und Wochen-ID sind Planungsinfo und stehen im Repo. */
  document.getElementById('weekContent').innerHTML = `
    <div class="rules-bar">
      ${discHTML('rule-rec-week', 'Recovery-Anpassung', recoveryPanelHTML(null))}
      ${discHTML('rule-out-week', 'Wenn eine Einheit ausfällt', ausfallPanelHTML())}
    </div>
    <button type="button" class="show-all-btn" id="toggle-days-top" onclick="collapseToToday()" style="display:none;margin-bottom:12px">Nur heute anzeigen</button>
    <div class="days">${cards}</div>
    <button type="button" class="show-all-btn" id="toggle-days-btn" onclick="toggleAllDays()">Alle Tage anzeigen</button>
    <div class="gloss-wrap" id="glossHost-week"></div>`;

  /* Für JEDEN Tag, nicht nur für die mit Notiz — sonst bleibt genau der Fall
     unsichtbar, um den es geht: der vergangene Trainingstag ohne Rückmeldung. */
  w.days.forEach(d => { restoreDraft(d.isoDate); patchNoteIndicator(d.isoDate); });
  if (w.dateFrom && w.dateTo) loadNotes(w.dateFrom, w.dateTo);
  fillGlossary('weekContent', 'glossHost-week');

  requestAnimationFrame(() => {
    w.days.forEach(d => setDayExpanded(d.isoDate, d.isoDate === today));
    if (w.dateFrom <= today && today <= w.dateTo) scrollToToday();
  });
}

/* Ohne Smooth-Animation: der erste Scroll läuft, bevor die Webfonts geladen
   sind — die Zielposition verschiebt sich danach noch. Deshalb hart springen
   und nach dem Font-Load einmal nachkorrigieren. */
function scrollToToday(){
  const go = () => {
    const card = document.getElementById('dc-' + todayLocal());
    if (card) card.scrollIntoView({ block:'start' });
  };
  go();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
}

/* Auf-/Zuklappen einer Tageskarte inklusive aria-Zustand */
function setDayExpanded(isoDate, expanded){
  const card = document.getElementById('dc-' + isoDate);
  if (!card || !card.dataset.expandable) return;
  const body = document.getElementById('dcb-' + isoDate);
  const chev = document.getElementById('dch-' + isoDate);
  const main = document.getElementById('dcm-' + isoDate);
  card.classList.toggle('collapsed', !expanded);
  if (body) body.hidden = !expanded;
  if (chev) {
    chev.setAttribute('aria-expanded', String(expanded));
    chev.setAttribute('aria-label', `${chev.dataset.dayLabel} ${expanded ? 'zuklappen' : 'aufklappen'}`);
  }
  if (main && main.dataset.role === 'toggle') main.setAttribute('aria-expanded', String(expanded));
}

function toggleDay(isoDate){
  const card = document.getElementById('dc-' + isoDate);
  if (!card) return;
  setDayExpanded(isoDate, card.classList.contains('collapsed'));
}

function toggleAllDays() {
  const collapsed = document.querySelectorAll('.day-card[data-expandable].collapsed');
  if (collapsed.length > 0) {
    collapsed.forEach(c => setDayExpanded(c.id.slice(3), true));
    document.getElementById('toggle-days-btn').textContent = 'Nur heute anzeigen';
    document.getElementById('toggle-days-top').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    collapseToToday();
  }
}

function collapseToToday() {
  const today = todayLocal();
  document.querySelectorAll('.day-card[data-expandable]').forEach(c =>
    setDayExpanded(c.id.slice(3), c.id === 'dc-' + today));
  document.getElementById('toggle-days-btn').textContent = 'Alle Tage anzeigen';
  document.getElementById('toggle-days-top').style.display = 'none';
  const todayCard = document.getElementById('dc-' + today);
  if (todayCard) todayCard.scrollIntoView({ behavior:'smooth', block:'start' });
}

function renderExercise(headers,row){
  const name=field(headers,row,['übung']), sets=field(headers,row,['sets','sätze']), dauer=field(headers,row,['dauer']);
  const last=field(headers,row,['last']), rpe=field(headers,row,['rpe']), tempo=field(headers,row,['tempo']);
  const rest=field(headers,row,['rest','pause']), note=field(headers,row,['note']);
  let chips='';
  if(sets)  chips+=`<div class="chip"><div class="chip-label">Sätze × Wdh</div><div class="chip-val">${stackSteps(sets)}</div></div>`;
  if(dauer) chips+=`<div class="chip"><div class="chip-label">Dauer</div><div class="chip-val">${splitMain(dauer)}</div></div>`;
  if(last)  chips+=`<div class="chip"><div class="chip-label">Last</div><div class="chip-val">${stackSteps(last)}</div></div>`;
  /* RPE hat keinen eigenen Chip mehr: Er war auf dem Handy das größte und
     einzige farbige Element der Karte, obwohl die Last die Zahl ist, wegen der
     man hinschaut. Er steht jetzt als Text bei Tempo und Pause. */
  const meta=[];
  if(rpe)   meta.push(`<span><b>RPE</b>${rpe}</span>`);
  if(tempo) meta.push(`<span><b>Tempo</b>${tempo}</span>`);
  if(rest)  meta.push(`<span><b>Pause</b>${rest}</span>`);
  /* Die Begründung ist der längste Text der Karte und wird mitten im Satz nicht
     gebraucht — sie steht hinter einem benannten Griff, die Zahlen stehen frei. */
  excSeq++;
  const noteBlock = note ? `<div class="exc-note-wrap">
      <button type="button" class="exc-note-btn" id="excn-${excSeq}-btn" aria-expanded="false" aria-controls="excn-${excSeq}"
              onclick="toggleExcNote(${excSeq})">${CHEV_DOWN}Warum so</button>
      <div class="exc-note" id="excn-${excSeq}" hidden>${rich(note)}</div>
    </div>` : '';
  return `<div class="exc"><div class="exc-name">${rich(splitMain(name))}</div>${chips?`<div class="exc-data">${chips}</div>`:''}${meta.length?`<div class="exc-meta">${meta.join('')}</div>`:''}${noteBlock}</div>`;
}

function renderWod(w){
  const tags = [
    w.format ? `<span class="wod-tag">${w.format}</span>` : '',
    w.level  ? `<span class="wod-tag level">${w.level}</span>` : '',
    w.rpe    ? `<span class="wod-tag">${w.rpe}</span>` : '',
    w.cap    ? `<span class="wod-tag cap">${w.cap}</span>` : ''
  ].join('');
  const lines = w.bewegungen.map(m =>
    `<div class="wod-line"><div class="wod-reps">${m.reps}</div><div class="wod-move">${rich(m.name)}</div>${m.detail?`<div class="wod-detail">${m.detail}</div>`:''}</div>`
  ).join('');
  return `<div class="wod">
    <div class="wod-struct">${w.struktur}</div>
    ${tags?`<div class="wod-tags">${tags}</div>`:''}
    <div class="wod-lines">${lines}</div>
    ${w.gesamt?`<div class="wod-total">Gesamt: ${rich(w.gesamt)}</div>`:''}
  </div>`;
}

/* Die Arbeitszahlen des Blocks für den zusammengeklappten Kopf.
   NICHT rows[0]: Zeile 0 ist oft ein Drill (RPE 6), nicht die Arbeit. Maßgeblich
   ist die Zeile mit dem höchsten RPE — sie trägt den eigentlichen Reiz. */
function blockPeek(b){
  if (b.wod) return stripHtml(b.wod.struktur);
  const rows = b.rows || [];
  if (!rows.length) return '';
  const main = v => stripHtml(String(v).split('||')[0]).replace(/\s+/g,' ').trim();
  const rpeOf = r => {
    const m = String(field(b.headers, r, ['rpe']) || '').match(/\d+/g);
    return m ? Math.max(...m.map(Number)) : -1;
  };
  let idx = 0;
  rows.forEach((r,i) => { if (rpeOf(r) > rpeOf(rows[idx])) idx = i; });
  const r = rows[idx];

  /* Eine Lasttreppe wird auf ihre letzten Stufen gekürzt, nicht auf die Enden:
     An der Stange lautet die Frage „welche Scheibe als nächstes", nicht
     „wo fängt es an und wo hört es auf". */
  const ramp = v => {
    const parts = v.split(/\s*(?:·|→)\s*/).filter(Boolean);
    return parts.length > 3 ? '… ' + parts.slice(-3).join(' · ') : v;
  };
  const sets = main(field(b.headers, r, ['sets','sätze']) || field(b.headers, r, ['dauer']) || '');
  const last = ramp(main(field(b.headers, r, ['last']) || ''));
  let peek = [sets, last].filter(Boolean).join(' · ');
  /* Blöcke ohne Last (Mobility) tragen sonst eine Zahl ohne Bezug. */
  if (!last) peek = [main(field(b.headers, r, ['übung'])), sets].filter(Boolean).join(' · ');
  if (rows.length > 1) peek += ` · +${rows.length - 1}`;
  return peek;
}

/* Das Maximalgewicht eines Blocks — die letzte Stufe der schwersten Zeile.
   Es gehört direkt an die Übung in der Wochenkarte, damit es sich nirgends
   wiederholen muss. Körpergewichtsblöcke liefern nichts. */
function blockTopLoad(b){
  const rows = b.rows || [];
  if (!rows.length) return '';
  const rpeOf = r => {
    const m = String(field(b.headers, r, ['rpe']) || '').match(/\d+/g);
    return m ? Math.max(...m.map(Number)) : -1;
  };
  let idx = 0;
  rows.forEach((r,i) => { if (rpeOf(r) > rpeOf(rows[idx])) idx = i; });
  const roh = stripHtml(String(field(b.headers, rows[idx], ['last']) || '').split('||')[0]);
  const stufen = roh.split(/\s*(?:·|→)\s*/).filter(Boolean);
  const letzte = (stufen[stufen.length-1] || '').trim();
  return /\d/.test(letzte) ? letzte : '';
}

/* Ablaufzustand eines Fokus-Tags. Blöcke sind standardmäßig OFFEN — die Zahlen
   stehen immer da. Zusammengeklappt wird nur, was erledigt ist oder was Martin
   selbst zuklappt; mehrere dürfen offen sein, wie bei den Tageskarten. */
function blkStateKey(){ return 'focus-state-' + currentWeekId + '-' + currentFocusKey; }
function loadBlkState(){
  try {
    const s = JSON.parse(localStorage.getItem(blkStateKey())) || {};
    return { done: s.done || [], collapsed: s.collapsed || [] };
  } catch(e){ return { done:[], collapsed:[] }; }
}
function saveBlkState(s){
  try { localStorage.setItem(blkStateKey(), JSON.stringify(s)); } catch(e){}
}

function renderBlock(b, state){
  const body = b.wod ? renderWod(b.wod) : (b.rows||[]).map(r=>renderExercise(b.headers,r)).join('');
  const optional = b.prio === 'optional';
  const done = state.done.includes(b.letter);
  /* Erledigte Blöcke klappen zu — die Seite wird kürzer, während die Einheit
     läuft, statt von Anfang an Zahlen zu verstecken. */
  const open = !done && !state.collapsed.includes(b.letter);
  const peek = blockPeek(b);
  const flags = [];
  const subHasMin = /\d+\s*min/.test(b.sub || '');
  if (b.min && !subHasMin) flags.push(`<span class="mchip">~${b.min} min</span>`);
  if (b.prio) flags.push(optional
    ? `<span class="mchip mchip-opt">Optional · zuerst streichbar</span>`
    : `<span class="mchip">Kernblock</span>`);
  const cls = ['blk', optional?'is-optional':'', open?'is-open':'', done?'is-done':''].filter(Boolean).join(' ');
  return `<section class="${cls}" id="blk-${b.letter}">
    <button type="button" class="blk-head" id="blk-${b.letter}-btn" aria-expanded="${open}" aria-controls="blkbody-${b.letter}" onclick="toggleBlock('${b.letter}')">
      <span class="blk-letter">${done ? CHECK_ICON : b.letter}</span>
      <span class="blk-headtext">
        <span class="blk-title">${escapeHtml(stripHtml(b.title))}</span>
        ${peek?`<span class="blk-peek">${escapeHtml(peek)}</span>`:''}
      </span>
      <span class="blk-chev">${CHEV_DOWN}</span>
    </button>
    <div class="blk-body" id="blkbody-${b.letter}"${open?'':' hidden'}>
      ${b.sub?`<div class="blk-sub">${rich(b.sub)}</div>`:''}
      ${flags.length?`<div class="blk-flags">${flags.join('')}</div>`:''}
      ${body}${b.note?`<div class="blk-note">${rich(b.note)}</div>`:''}
      <button type="button" class="blk-done" onclick="markBlockDone('${b.letter}')">
        ${CHECK_ICON}${done ? 'Erledigt — nochmal öffnen' : 'Erledigt'}
      </button>
    </div>
  </section>`;
}

/* Kein Zwang mehr: Auf- und Zuklappen betrifft nur den angetippten Block. */
function toggleBlock(letter){
  const s = loadBlkState();
  const i = s.collapsed.indexOf(letter);
  const body = document.getElementById('blkbody-' + letter);
  const sec = document.getElementById('blk-' + letter);
  const btn = document.getElementById('blk-' + letter + '-btn');
  if (!body || !sec || !btn) return;
  const open = body.hidden;
  if (open) { if (i >= 0) s.collapsed.splice(i,1); }
  else if (i < 0) s.collapsed.push(letter);
  saveBlkState(s);
  body.hidden = !open;
  sec.classList.toggle('is-open', open);
  btn.setAttribute('aria-expanded', String(open));
}

/* Erledigt: Block zuklappen und dimmen, zum nächsten offenen Kernblock scrollen.
   Nochmaliges Tippen nimmt es zurück — kein Zustand ohne Rückweg. */
function markBlockDone(letter){
  const s = loadBlkState();
  const f = getWeek(currentWeekId).focusDays[currentFocusKey];
  const i = s.done.indexOf(letter);
  if (i >= 0){ s.done.splice(i,1); saveBlkState(s); renderFocus(currentFocusKey); return; }
  s.done.push(letter);
  const ci = s.collapsed.indexOf(letter);
  if (ci >= 0) s.collapsed.splice(ci,1);
  saveBlkState(s);
  pushBlocksDone(s.done);
  renderFocus(currentFocusKey);
  const next = f.blocks.find(b => !s.done.includes(b.letter) && b.prio !== 'optional')
            || f.blocks.find(b => !s.done.includes(b.letter));
  if (next){
    const sec = document.getElementById('blk-' + next.letter);
    if (sec) sec.scrollIntoView({ behavior:'smooth', block:'start' });
  }
  maybePromptNote(f, s.done);
}

/* Sind alle Kernblöcke erledigt und der Session-Feel noch leer, das Notizfeld
   aufmachen — das ist der einzige Moment, in dem das Handy noch in der Hand ist. */
function maybePromptNote(f, done){
  const kern = f.blocks.filter(b => b.prio !== 'optional').map(b => b.letter);
  if (!kern.every(l => done.includes(l))) return;
  const d = focusIsoDate(currentFocusKey);
  if (!d) return;
  const note = weekNotes[d], draft = loadDraft(d);
  if ((note && note.session_feel > 0) || (draft && draft.feel > 0)) return;
  const panel = document.getElementById('f-np-' + d);
  if (!panel || !panel.hidden) return;
  toggleNote(d, 'f-');
  setTimeout(() => {
    const el = document.querySelector('#focusContent .feel-row');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 350);
}

function focusIsoDate(key){
  const day = getWeek(currentWeekId).days.find(d => d.focus === key);
  return day ? day.isoDate : null;
}

/* Der Erledigt-Vektor ist der billigste Rückkanal, den es gibt: ein Tap im
   Moment des Geschehens. Er darf nicht in localStorage enden — der Coach muss
   ihn beim Wochenreview sehen, auch wenn keine Notiz geschrieben wurde. */
async function pushBlocksDone(done){
  const d = focusIsoDate(currentFocusKey);
  if (!d) return;
  const note = weekNotes[d] || {};
  try {
    await fetch('/save_note.php', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        session_key: d, note_date: d,
        session_feel: selectedFeel[d] || note.session_feel || 0,
        note_text: note.note_text || '',
        blocks_done: done.join(',')
      })
    });
    weekNotes[d] = Object.assign({}, note, { blocks_done: done.join(',') });
    patchNoteIndicator(d);
  } catch(e){ /* offline: der Zustand bleibt lokal, nächster Speichervorgang trägt ihn nach */ }
}

/* WHOOP: kopierbarer Textblock statt Liste */
/* Der Begründungstext gehört in die Zwischenablage, nicht ein zweites Mal auf den
   Bildschirm — sichtbar bleibt die Übungsliste, kopiert wird sie samt Intro. */
function renderWhoopCopy(f){
  const lines = f.whoop.map(([n,d]) => `${stripHtml(n)}: ${stripHtml(d)}`).join('\n');
  const introPlain = f.intro ? stripHtml(f.intro) : '';
  const shown = `${stripHtml(f.title)}\n${stripHtml(f.date)}\n\n${lines}`;
  const text = `${shown}${introPlain ? `\n\n${introPlain}` : ''}`;
  return `<div class="whoop-copy" data-whoop-text="${encodeURIComponent(text)}">
    <div class="whoop-copy-head"><span class="whoop-copy-title">Für WHOOP kopieren</span>
      <button type="button" class="copy-btn" aria-label="WHOOP-Übungsliste in die Zwischenablage kopieren" onclick="copyWhoopText(this)">${COPY_ICON}Kopieren</button></div>
    <div class="whoop-text">${escapeHtml(shown)}</div></div>`;
}

function copyWhoopText(btn){
  const box = btn.closest('.whoop-copy');
  const text = decodeURIComponent(box.dataset.whoopText);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Kopiert!';
    setTimeout(() => { btn.innerHTML = `${COPY_ICON}Kopieren`; }, 1500);
  });
}

/* Dauer- und Prioritätskopf einer Routine */
/* Ein Chip, nicht drei. Wer die Routine geöffnet hat, hat die Priorisierung
   längst entschieden; die Herleitung der Zeitschätzung steht im Warum-Panel. */
function routineMetaHTML(f){
  if (!f.dauer) return '';
  /* Gleiche Schreibweise wie auf der Wochenkarte — eine Sache, eine Notation. */
  const zahl = v => (String(v).match(/[\d,.]+/) || [''])[0];
  const kern = zahl(f.dauer.kern), ges = zahl(f.dauer.gesamt);
  const spanne = kern && ges && kern !== ges ? `${kern}–${ges}` : (ges || kern);
  return spanne ? `<div class="routine-meta"><span class="mchip prio-1">T ${spanne} min</span></div>` : '';
}

function renderFocus(key){
  const w=getWeek(currentWeekId), f=w.focusDays[key];
  if(!f){ document.getElementById('focusContent').innerHTML='<div class="empty">Kein Focus-Tag.</div>'; return; }
  currentFocusKey = key;

  excSeq = 0;
  /* Blöcke sind offen, bis sie erledigt oder bewusst zugeklappt sind. */
  const state = loadBlkState();

  /* Begründung, Warm-up und Schätzmethodik sind Vorabend-Material — sie stehen
     nicht mehr zwischen der Überschrift und der ersten Zahl der Einheit. */
  const whyParts = [
    f.intro ? `<p class="detail-sub">${rich(f.intro)}</p>` : '',
    f.dauer && (f.dauer.warmup || f.dauer.hinweis)
      ? `<p class="routine-meta-note">${[f.dauer.warmup, f.dauer.hinweis].filter(Boolean).join(' · ')}</p>` : ''
  ].filter(Boolean).join('');

  /* Die Notiz gehört an das Ende der Einheit, nicht hinter eine Rücknavigation. */
  const focusDay = w.days.find(d => d.focus === key);

  document.getElementById('focusContent').innerHTML=`
    <div class="crumb"><button type="button" class="lnk" onclick="showWeek()">${w.label}</button><span class="sep">/</span>Focus-Tag ${key}</div>
    <div class="page-header"><div class="eyebrow">${f.date}</div><h1>${f.title}</h1></div>
    ${routineMetaHTML(f)}
    ${discHTML('rule-rec-focus', 'Recovery-Anpassung', recoveryPanelHTML(f.recoveryDay))}
    ${whyParts ? discHTML('focus-why', 'Warum diese Einheit so aussieht', whyParts) : ''}
    ${f.blocks.map(b => renderBlock(b, state)).join('')}
    ${focusDay ? buildNoteHTML(focusDay.isoDate, 'own', 'f-') : ''}
    ${renderWhoopCopy(f)}
    ${discHTML('rule-out-focus', 'Wenn diese Einheit ausfällt', ausfallPanelHTML())}
    <div class="gloss-wrap" id="glossHost-focus"></div>
    <button type="button" class="nav-back" onclick="showWeek()" style="margin-top:28px">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
      Zurück zum Wochenplan
    </button>`;
  saveBlkState(state);
  if (focusDay) { patchNoteUI(focusDay.isoDate, weekNotes[focusDay.isoDate]); restoreDraft(focusDay.isoDate); }
  fillGlossary('focusContent', 'glossHost-focus');
}

/* Navigation (Hash-Routing) */
let renderedWeekId = null;

function switchView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  /* Hart auf 0 setzen, nicht smooth: renderWeek() scrollt danach im
     requestAnimationFrame auf den heutigen Tag — eine laufende Smooth-
     Animation würde diesen zweiten Scroll sonst überschreiben. */
  window.scrollTo({top:0});
}

function navigate(wid, fkey){
  const target = fkey ? `${wid}/${fkey}` : wid;
  if (location.hash.slice(1) === target) applyRoute();
  else location.hash = target;
}

function showWeek(){ navigate(currentWeekId); }
function showFocus(key){ navigate(currentWeekId, key); }

function applyRoute(){
  closeTerm();
  const [wid, fkey] = location.hash.slice(1).split('/');
  if (wid && getWeek(wid)) {
    currentWeekId = wid;
  } else {
    currentWeekId = currentWeek().id;
    history.replaceState(null, '', '#' + currentWeekId);
  }
  document.getElementById('weekSelect').value = currentWeekId;
  if (renderedWeekId !== currentWeekId) {
    renderWeek();
    renderedWeekId = currentWeekId;
  }
  const w = getWeek(currentWeekId);
  if (fkey && w.focusDays && w.focusDays[fkey]) {
    renderFocus(fkey);
    switchView('view-focus');
  } else {
    switchView('view-week');
  }
}

window.addEventListener('hashchange', applyRoute);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

initSelect();
if (location.hash.slice(1).split('/')[0] !== currentWeekId) {
  history.replaceState(null, '', '#' + currentWeekId);
}
applyRoute();
</script>
