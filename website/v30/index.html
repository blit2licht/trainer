<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training 3.0</title>
<meta name="theme-color" content="#0f1113">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Spline+Sans+Mono:wght@400;500;700&display=swap">
<style>
/* ═══ Trainer 3.0 · Handy-Clickdummy ═══
   Basis: design/dunkelkammer.html UNVERÄNDERT (Designwelt, gelockt 22.08.).
   Eingriffe nur: (1) Verdict pro Übung ersetzt „Block erledigt",
   (2) keine Wochenwahl am Handy, (3) Verdict-Stub in localStorage. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --g0:oklch(11% 0.006 62);  --g1:oklch(14.5% 0.007 62); --g2:oklch(18% 0.008 62);
  --g3:oklch(22% 0.009 62);  --g4:oklch(28% 0.010 62);   --g5:oklch(36% 0.011 62);
  --g6:oklch(47% 0.012 62);  --g7:oklch(61% 0.012 62);   --g8:oklch(76% 0.010 62);
  --g9:oklch(88% 0.008 62);  --g10:oklch(97% 0.005 62);

  --amber:oklch(80% 0.152 72);
  --amber-ink:oklch(14% 0.02 62);
  --amber-dim:oklch(34% 0.075 68);
  --cool:oklch(80% 0.118 196);
  --cool-dim:oklch(31% 0.055 198);
  --good:oklch(80% 0.14 152);
  --good-dim:oklch(32% 0.07 152);

  --disp:'Archivo',system-ui,sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --g0:oklch(98.5% 0.003 62); --g1:oklch(96% 0.004 62);  --g2:oklch(93% 0.005 62);
    --g3:oklch(89% 0.006 62);   --g4:oklch(82% 0.007 62);  --g5:oklch(70% 0.009 62);
    --g6:oklch(56% 0.011 62);   --g7:oklch(43% 0.012 62);  --g8:oklch(30% 0.010 62);
    --g9:oklch(20% 0.008 62);   --g10:oklch(12% 0.006 62);
    --amber:oklch(58% 0.148 62);
    --amber-ink:oklch(99% 0.004 62);
    --amber-dim:oklch(90% 0.055 66);
    --cool:oklch(48% 0.115 205);
    --cool-dim:oklch(91% 0.045 200);
    --good:oklch(52% 0.13 152);
    --good-dim:oklch(90% 0.06 152);
  }
}
:root[data-theme="light"]{
  --g0:oklch(98.5% 0.003 62); --g1:oklch(96% 0.004 62);  --g2:oklch(93% 0.005 62);
  --g3:oklch(89% 0.006 62);   --g4:oklch(82% 0.007 62);  --g5:oklch(70% 0.009 62);
  --g6:oklch(56% 0.011 62);   --g7:oklch(43% 0.012 62);  --g8:oklch(30% 0.010 62);
  --g9:oklch(20% 0.008 62);   --g10:oklch(12% 0.006 62);
  --amber:oklch(58% 0.148 62);
  --amber-ink:oklch(99% 0.004 62);
  --amber-dim:oklch(90% 0.055 66);
  --cool:oklch(48% 0.115 205);
  --cool-dim:oklch(91% 0.045 200);
  --good:oklch(52% 0.13 152);
  --good-dim:oklch(90% 0.06 152);
}

:root{
  --ground:var(--g0); --ground-2:var(--g1);
  --rule:var(--g4); --rule-2:var(--g2);
  --ink:var(--g10); --ink-2:var(--g7); --ink-3:var(--g6);
  --marker:var(--amber);
}

html{background:var(--ground);-webkit-text-size-adjust:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--disp);font-variation-settings:'wdth' 100;
  font-size:17px;line-height:1.45;min-height:100vh;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}

::selection{background:var(--marker);color:#fff}
:root{accent-color:var(--marker);caret-color:var(--marker)}
:focus-visible{outline:2.5px solid var(--marker);outline-offset:3px}
*{scrollbar-color:var(--g4) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--g4);border:3px solid var(--ground)}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-underline-offset:3px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ═══ Schiene ═══ */
.rail{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:0 20px;min-height:52px;
  background:var(--ground);border-bottom:1px solid var(--rule);
}
.rail::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:var(--rule);
}
.rail-week{
  font-family:var(--mono);font-size:12.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink);
}
.rail-meso{
  margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rail{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* ═══ Backend-Setup (Long-Press auf die Rail) ═══ */
.setup-pop{
  position:fixed;top:52px;left:0;right:0;z-index:40;
  background:var(--ground);border-bottom:1px solid var(--rule);
  padding:16px 20px 18px;font-family:var(--mono);
  box-shadow:0 12px 28px oklch(0% 0 0 / .28);
}
.setup-row{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.setup-label{
  font-size:11.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);
}
.setup-state{
  font-size:11.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--amber);
}
.setup-x{
  margin-left:auto;background:none;border:0;color:var(--ink-3);
  font-family:var(--mono);font-size:14px;cursor:pointer;padding:2px 6px;
}
.setup-form{display:flex;gap:8px}
.setup-in{
  flex:1;min-width:0;background:var(--g2);border:1px solid var(--rule);
  color:var(--ink);font-family:var(--mono);font-size:13px;
  padding:9px 10px;border-radius:2px;
}
.setup-in:focus{outline:none;border-color:var(--amber)}
.setup-go,.setup-off{
  font-family:var(--mono);font-size:11.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  padding:9px 14px;border-radius:2px;border:1px solid var(--rule);
}
.setup-go{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.setup-off{background:none;color:var(--ink-3)}
.setup-msg{
  margin-top:10px;font-size:12px;color:var(--ink-3);letter-spacing:.03em;
}

/* ═══ Rahmen ═══ */
.wrap{padding:0 20px 96px}
@media (min-width:1100px){
  .rail{padding:0 40px}
  .wrap{
    padding:0 40px 120px;max-width:1320px;margin:0 auto;
    display:grid;grid-template-columns:minmax(0,1fr) 300px;
    column-gap:56px;align-items:start;
  }
  .col-main{min-width:0}
  .apparat{position:sticky;top:84px}
}
@media (max-width:1099px){ .apparat{display:none} }
@media (max-width:430px){ .rail-meso{display:none} }

/* ═══ Heute ═══ */
.today{padding:38px 0 34px}
.today-when{
  font-family:var(--mono);font-size:12.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.today-when b{color:var(--g9);font-weight:700}
.today-when .now{color:var(--amber);font-weight:700}
.today-what{
  font-family:var(--disp);font-variation-settings:'wdth' 88;
  font-weight:800;letter-spacing:-.03em;line-height:.98;
  font-size:clamp(2rem,8.5vw,3.25rem);
  margin-top:10px;text-wrap:balance;max-width:20ch;
}
.today-what.is-l{font-size:clamp(1.6rem,6.4vw,2.4rem);max-width:26ch}
.today-what-2{
  margin-top:8px;font-family:var(--disp);font-variation-settings:'wdth' 92;
  font-weight:600;font-size:clamp(1.05rem,4.3vw,1.4rem);
  letter-spacing:-.015em;line-height:1.25;color:var(--ink-2);max-width:40ch;
}
.today-figure{display:flex;align-items:flex-end;gap:14px;margin-top:30px;flex-wrap:wrap}
.load-num{
  font-family:var(--disp);font-variation-settings:'wdth' 124;
  font-weight:900;letter-spacing:-.05em;line-height:.78;
  font-size:clamp(4.25rem,21vw,6rem);color:var(--g10);
}
.load-unit{
  font-family:var(--mono);font-size:15px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding-bottom:.5em;
}
.load-src{
  margin-top:12px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.06em;color:var(--ink-3);
}
.today-sub{
  margin-top:22px;font-size:16px;line-height:1.55;color:var(--ink-2);max-width:58ch;
}
.rx-line{
  margin-top:18px;font-family:var(--mono);font-size:13.5px;color:var(--ink-2);line-height:1.65;
}
.rx-line .rv{color:var(--ink);font-weight:700}

.go{
  display:inline-flex;align-items:center;gap:10px;
  margin-top:26px;min-height:48px;padding:0 20px 0 18px;
  background:var(--ink);color:var(--ground);border:none;
  font-family:var(--mono);font-size:12.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;cursor:pointer;
  transition:background .14s var(--ease);
}
.go:hover{background:var(--marker);color:#fff}
.go svg{width:13px;height:13px}

/* ═══ Restwoche ═══ */
.week-head{
  font-family:var(--mono);font-size:11.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
  padding-top:34px;margin-bottom:2px;
}
.strip{
  display:grid;grid-template-columns:92px 22px minmax(0,1fr) auto;
  align-items:baseline;gap:10px 14px;
  width:100%;min-height:72px;padding:16px 14px;margin:0 -14px;
  background:none;border:none;border-top:1px solid var(--rule-2);
  font:inherit;color:inherit;text-align:left;cursor:pointer;
  transition:opacity .14s var(--ease);
}
.strip:last-of-type{border-bottom:1px solid var(--rule-2)}
.strip[data-nav="0"]{cursor:default}
.strip:hover .strip-day{color:var(--marker)}
.strip-when{min-width:0}
.strip-day{
  display:block;font-family:var(--disp);font-variation-settings:'wdth' 88;
  font-weight:700;font-size:16px;letter-spacing:-.01em;
  transition:color .14s var(--ease);
}
.strip-date{
  display:block;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase;margin-top:3px;
}
.strip-unit{
  min-width:0;font-size:15.5px;color:var(--ink-2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.strip-load{
  font-family:var(--disp);font-variation-settings:'wdth' 118;
  font-weight:900;font-size:34px;letter-spacing:-.04em;white-space:nowrap;
  text-align:right;color:var(--g10);line-height:.95;
}
/* "60 kg" ist ein zusammenhängender Ausdruck — Einheit bleibt in der Zeile. */
.strip-load small{
  display:inline;margin-left:5px;font-family:var(--mono);font-size:12px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
}
.strip-load.is-word{
  font-family:var(--mono);font-variation-settings:normal;
  font-size:11.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
/* Typ-Symbol als eigene Spalte, auf Höhe des Tagesnamens. */
.strip-ico{color:var(--ink-3);align-self:start;padding-top:3px;line-height:0}
.strip-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Heute: helles Bernstein-Feld; Ruhetag: stilles Grau-Feld. */
.strip.is-today{background:color-mix(in oklch, var(--ground), var(--amber) 14%)}
.strip.is-today .strip-day{color:var(--marker)}
.strip.is-rest{background:var(--ground-2);opacity:.8}
.strip.is-rest .strip-day{color:var(--ink-3)}
.strip-load .range{font-size:22px;font-variation-settings:'wdth' 108;letter-spacing:-.02em}
.strip.is-rest .strip-load{font-variation-settings:'wdth' 88;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ═══ Fokus-Tag ═══ */
.back{
  display:inline-flex;align-items:center;gap:9px;
  margin:26px 0 0;min-height:44px;padding:0 2px 0 0;
  background:none;border:none;color:var(--ink-3);cursor:pointer;
  font-family:var(--mono);font-size:12px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;
  transition:color .14s var(--ease);
}
.back:hover{color:var(--ink)}
.back svg{width:12px;height:12px}

.focus-head{padding:8px 0 30px}
.focus-when{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.focus-title{
  font-family:var(--disp);font-variation-settings:'wdth' 86;
  font-weight:800;letter-spacing:-.03em;line-height:1;
  font-size:clamp(1.9rem,7.5vw,3rem);margin-top:10px;text-wrap:balance;
}
.focus-dauer{
  margin-top:16px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.06em;color:var(--ink-3);
}
.focus-dauer b{color:var(--ink-2);font-weight:700}

.blk{padding:30px 0;border-top:1px solid var(--rule)}
.blk-top{display:flex;align-items:baseline;gap:16px}
.blk-letter{
  font-family:var(--disp);font-variation-settings:'wdth' 124;
  font-weight:900;font-size:clamp(2.6rem,11vw,3.6rem);line-height:.72;
  letter-spacing:-.05em;color:var(--g4);flex:0 0 auto;
  transition:color .16s var(--ease);
}
.blk.is-open .blk-letter{color:var(--g10)}
.blk.is-done .blk-letter{color:var(--cool-dim)}
.blk-name{
  font-family:var(--disp);font-variation-settings:'wdth' 92;
  font-weight:700;font-size:clamp(1.15rem,4.6vw,1.45rem);
  letter-spacing:-.02em;line-height:1.12;flex:1;min-width:0;
}
/* Zeit und Blockrang tragen das Sicherheitslicht. */
.blk-flags{
  display:flex;gap:14px;margin-top:9px;
  font-family:var(--mono);font-size:11.5px;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--marker);
}
.blk-top .vflag{
  margin-left:auto;flex:0 0 auto;align-self:center;
  font-family:var(--mono);font-size:17px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
}
.vflag.ok{color:var(--good)}
.vflag.no{color:var(--marker)}
/* Geloggt = eingeklappt und grau; offen bleibt tiefschwarz.
   Der Buchstabe trägt das Urteil hinter Milchglas: stark Richtung Grund
   abgeblendetes Grün bzw. Bernstein. */
.blk.is-logged .blk-name{color:var(--ink-3)}
.blk.is-logged.is-done .blk-letter{color:color-mix(in oklch, var(--good) 30%, var(--ground))}
.blk.is-logged.is-failed .blk-letter{color:color-mix(in oklch, var(--amber) 30%, var(--ground))}
.blk-toggle{
  background:none;border:none;color:inherit;font:inherit;cursor:pointer;
  display:block;width:100%;text-align:left;padding:0;min-height:44px;
}
.blk-body{padding-left:0;margin-top:10px}
@media (min-width:700px){ .blk-body{padding-left:clamp(0px,7vw,84px)} }

.ex{padding:22px 0 6px}
.ex + .ex{border-top:1px solid var(--rule-2);margin-top:6px}
.ex-name{
  font-family:var(--disp);font-variation-settings:'wdth' 92;
  font-weight:700;font-size:20px;letter-spacing:-.015em;line-height:1.15;
}
.ex-name small{
  display:block;font-family:var(--mono);font-size:12px;font-weight:400;
  letter-spacing:.02em;color:var(--ink-3);margin-top:5px;
}
.ex.is-single{padding-top:6px}
.ex-qual{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-bottom:2px}
/* Rep-Schema führt: eine Zeile Schema · Gewicht, Zusatz darunter. */
.ex-sets{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ex-sets .reps{
  font-family:var(--disp);font-variation-settings:'wdth' 112;
  font-weight:800;font-size:23px;letter-spacing:-.02em;color:var(--ink);
}
.ex-sets .xload{font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--ink-2)}
/* Superset: das Paar hängt sichtbar zusammen, Rest gilt dem Paar. */
.superset{border-left:2px solid var(--amber-dim);padding-left:16px;margin-top:10px}
.ss-label{
  font-family:var(--mono);font-size:11.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--marker);margin-top:12px;
}
.ex-sub{
  font-family:var(--mono);font-size:12px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;
}

/* Lastleiter + Teststreifen */
.ladder{
  margin-top:16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 9px;
  font-family:var(--disp);font-variation-settings:'wdth' 112;
  font-weight:700;font-size:clamp(1.4rem,6vw,1.9rem);letter-spacing:-.035em;
  color:var(--ink-2);line-height:1.25;
}
.rung.is-target{
  color:var(--ink);font-weight:800;
  font-size:clamp(1.75rem,7.6vw,2.45rem);
}
.rung-sep{color:var(--ink-3);font-weight:400}
.teststrip{
  display:flex;align-items:stretch;gap:2px;margin-top:18px;
  border:1px solid var(--g3);
}
.ts{
  flex:1 1 0;min-width:0;min-height:74px;
  display:flex;align-items:flex-end;justify-content:center;padding:0 2px 9px;
  background:color-mix(in oklch, var(--g1), var(--g5) calc(var(--z) * 100%));
}
.ts-kg{
  font-family:var(--disp);font-variation-settings:'wdth' 92;
  font-weight:700;font-size:14px;letter-spacing:-.02em;color:var(--g8);
}
.ts.is-target{
  background:var(--amber);flex:1.5 1 0;align-items:center;
}
.ts.is-target .ts-kg{
  color:var(--amber-ink);font-variation-settings:'wdth' 118;
  font-weight:900;font-size:clamp(1.6rem,7vw,2.3rem);letter-spacing:-.045em;
}
.ladder-foot{
  margin-top:9px;font-family:var(--mono);font-size:12px;
  letter-spacing:.06em;color:var(--g6);
}
.ts-mark{color:var(--amber);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}

/* ═══ Stationsbahn ═══ */
.stations{
  position:sticky;top:52px;z-index:15;
  display:flex;gap:2px;margin:0 -20px;padding:10px 20px;
  background:var(--g0);border-bottom:1px solid var(--g3);
  overflow-x:auto;scrollbar-width:none;
}
.stations::-webkit-scrollbar{display:none}
@media (min-width:1100px){ .stations{margin:0 -8px;padding:10px 8px} }
.st{
  flex:0 0 auto;display:flex;align-items:baseline;gap:7px;
  min-height:44px;padding:0 13px;
  background:none;border:1px solid var(--g3);color:var(--g6);cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;
  transition:color .16s var(--ease),border-color .16s var(--ease);
}
.st-l{font-family:var(--disp);font-variation-settings:'wdth' 118;font-weight:900;font-size:15px;letter-spacing:0}
.st:hover{color:var(--g9);border-color:var(--g5)}
.st.is-now{color:var(--amber);border-color:var(--amber)}
.st.is-done{color:var(--cool);border-color:var(--cool-dim)}
.st.is-done .st-t{text-decoration:line-through;text-decoration-thickness:1px}

.rung-arrow{
  font-family:var(--mono);font-size:.5em;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:0 2px;
}
.ladder-steps{
  margin-top:8px;font-family:var(--mono);font-size:13px;font-weight:500;
  color:var(--ink-3);letter-spacing:.04em;line-height:1.6;
}
.ladder-unit{

</head>
<body>

<header class="rail">
  <span class="rail-week" id="railWeek"></span>
  <span class="rail-meso" id="railMeso"></span>
</header>

<div class="wrap">
  <div class="col-main">
    <main id="viewWeek"></main>
    <main id="viewFocus" hidden></main>
  </div>
  <aside class="apparat" id="apparat"></aside>
</div>

<script src="./data.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   DUNKELKAMMER — Rendering-Kern (aus design/dunkelkammer.html)
   Trainer-3.0-Eingriffe: Verdict-Overlay + Stub, keine Wochenwahl.
   ════════════════════════════════════════════════════════════════════ */

const fmt = n => (Math.round(n*100)/100).toString().replace('.', ',');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stripHtml = s => String(s).replace(/<[^>]*>/g,'');

/* ── V3-Overlay wird vom Adapter aus dem 3.0-Payload gebaut (nicht mehr hart
   verdrahtet): V3[iso][block_id] = { ex_id, cls }. warum ist Datenfeld für
   Engine/Werkstatt — wird hier nie gerendert. ── */
let V3 = {};

/* ── 3.0-Payload → Render-Form (2.x-Kontrakt des Dunkelkammer-Renders).
   Der approbierte Render bleibt unangetastet; nur diese Übersetzung ist neu. ── */
const WD_NAMES = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function isoDD(iso){ const p = String(iso).split('-'); return p[2] + '.' + p[1] + '.'; }
function isoWD(iso){ return WD_NAMES[new Date(iso + 'T00:00:00').getDay()]; }

function exRow(ex){
  const t = ex.target || {};
  const uebung = ex.kurz || ex.ex_id;
  const sr = (t.sets != null && t.reps != null) ? `${t.sets} × ${t.reps}` : '';
  let setsCell = '', last = '', sub = [];
  if (t.mode === 'kg'){
    setsCell = sr;
    last = (t.ramp && t.ramp.length > 1) ? t.ramp.map(fmt).join(' → ') + ' kg'
         : (t.kg != null ? fmt(t.kg) + ' kg' : '');
  } else if (t.mode === 'bw'){
    setsCell = sr; last = 'BW'; if (t.unbroken) sub.push('unbroken');
  } else if (t.mode === 'bw_plus'){
    // Zusatzlast steht DANEBEN ("3 × 4 @ +5 kg"), nicht darunter.
    setsCell = sr; last = (t.kg != null ? '+' + fmt(t.kg) + ' kg' : 'BW');
  } else if (t.mode === 'time'){
    setsCell = (t.sets && t.sec) ? `${t.sets} × ${t.sec} sec`
             : (t.sec ? `${Math.round(t.sec / 60)} min` : sr);
    last = '';
  } else if (t.mode === 'band'){
    setsCell = sr; last = t.band || 'Band';
  } else { setsCell = sr; }
  if (sub.length) setsCell += '||' + sub.join(' · ');
  const rest = t.rest || t.interval || '';
  const rpe = t.rpe_cap != null ? '≤' + t.rpe_cap : '';
  // Reihenfolge = headers unten. Note bleibt leer (warum/note nie am Handy).
  return [uebung, setsCell, last, t.tempo || '', rest, rpe, ''];
}
const ROW_HEADERS = ['Übung','Sets × Reps','Last','Tempo','Rest','RPE','Note'];

function adapt(D3){
  const w = D3.week || {};
  const focusDays = {}, focusLabels = {}, v3 = {};
  const days = (w.days || []).map(day => {
    const base = { isoDate: day.iso_date, date: isoDD(day.iso_date),
                   day: isoWD(day.iso_date), type: day.day_type };
    if (day.day_type === 'own'){
      base.focus = day.focus;
      focusLabels[day.focus] = day.focus_label;
      const blocks = (day.blocks || []).map(b => {
        const first = (b.exercises || [])[0] || {};
        v3[day.iso_date] = v3[day.iso_date] || {};
        v3[day.iso_date][b.block_id] = { ex_id: b.verdict_ex_id || first.ex_id,
                                         cls: b.verdict_class || first.class || 'loadable' };
        return { letter: b.block_id, title: b.title, prio: b.prio, min: b.min,
                 kurz: first.kurz, superset: b.superset,
                 headers: ROW_HEADERS, rows: (b.exercises || []).map(exRow) };
      });
      const z = day.zeit_spanne;
      focusDays[day.focus] = { isoDate: day.iso_date, date: isoDD(day.iso_date),
        title: day.focus_label, blocks, wod: [],
        dauer: z ? { kern: z[0] + ' min', gesamt: z[1] + ' min' } : null };
      base.einheit = day.focus_label;
    } else if (day.wod && day.wod._placeholder){
      base.einheit = day.day_type === 'ride' ? 'Radfahrt' : 'Box';
      base.sub = day.wod._placeholder;
    } else if (day.day_type === 'rest'){
      base.einheit = 'Ruhetag';
    }
    return base;
  });
  return { weeks: [{ id: w.id, meso: w.meso || w.label || w.id,
                     label: w.label, days, focusDays }],
           focusLabels, V3: v3 };
}

/* ── Verdict-Backend: Stub (localStorage, offline) oder http (echte Endpoints).
   Umschaltbar über localStorage 'v3_backend'='http' + Secret in 'v3_secret'.
   Angezeigt wird immer der Cache-Stand = Serverstand nach save/hydrate. ── */
const VKEY = 'v3_verdicts', SKEY = 'v3_secret';
const EP_SAVE = '../save_verdict.php';
const EP_GET  = '../get_verdicts.php';
const backendMode = (localStorage.getItem('v3_backend') === 'http') ? 'http' : 'stub';
const vstore = {
  cache: {},
  get(iso, ex){ return this.cache[iso + '|' + ex] || null; },
  async hydrate(from, to){
    if (backendMode === 'http'){
      try {
        const r = await fetch(`${EP_GET}?from=${from}&to=${to}`);
        const j = await r.json();
        (j.verdicts || []).forEach(v => {
          this.cache[v.iso_date + '|' + v.ex_id] =
            { verdict: v.verdict, reason: v.miss_reason, at: v.updated_at };
        });
      } catch(e){ /* Funkloch: Cache bleibt leer, Offline-Puffer greift lokal */ }
    } else {
      try { Object.assign(this.cache, JSON.parse(localStorage.getItem(VKEY)) || {}); }
      catch(e){}
    }
  },
  async save(iso, ex, verdict, reason){
    if (backendMode === 'http'){
      const r = await fetch(EP_SAVE, { method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ secret: localStorage.getItem(SKEY) || '',
          iso_date: iso, ex_id: ex, verdict, miss_reason: reason || null }) });
      const j = await r.json();
      if (!r.ok || !j || !j.verdict) throw new Error('save failed');
      const v = j.verdict;   // Serverstand, nie die Tap-Annahme
      this.cache[iso + '|' + ex] = { verdict: v.verdict, reason: v.miss_reason, at: v.updated_at };
    } else {
      await new Promise(r => setTimeout(r, 160));
      this.cache[iso + '|' + ex] = { verdict, reason: reason || null, at: new Date().toISOString() };
      const all = JSON.parse(localStorage.getItem(VKEY) || '{}');
      all[iso + '|' + ex] = this.cache[iso + '|' + ex];
      localStorage.setItem(VKEY, JSON.stringify(all));
    }
  },
  async clear(iso, ex){
    // Kein Delete-Endpoint (nur get/save) — http löscht nur die lokale Sicht.
    delete this.cache[iso + '|' + ex];
    if (backendMode !== 'http'){
      const all = JSON.parse(localStorage.getItem(VKEY) || '{}');
      delete all[iso + '|' + ex]; localStorage.setItem(VKEY, JSON.stringify(all));
    }
  }
};
let askOpen = null;   // iso|ex mit offener Technik/Last-Rückfrage

/* ── Last-Strings aus data.js deuten ── */
function parseLoad(raw, opts){
  opts = opts || {};
  if (!raw) return { kind:'none' };
  const s = String(raw).trim();
  if (!s || s === '—' || s === '-') return { kind:'none' };
  if (/^bw$/i.test(s)) return { kind:'bw' };
  if (s.startsWith('+')) return { kind:'text', text:s };   // Zusatzlast "+5 kg"
  if (opts.requireUnit && !/\bkg\b/i.test(s)) return { kind:'text', text:s };

  const db = s.match(/^(\d+)\s*[×x]\s*([\d.,]+)(?:\s*[–-]\s*([\d.,]+))?\s*kg/i);
  if (db) return { kind:'db', count:+db[1], each:num(db[2]), eachTo: db[3] ? num(db[3]) : null };

  const nums = s.split(/·|→|->/).map(p => {
    const m = p.match(/([\d]+(?:[.,]\d+)?)/);
    return m ? num(m[1]) : null;
  }).filter(n => n !== null && n > 0);

  if (!nums.length) return { kind:'text', text:s };
  return { kind:'bar', steps:nums };
}
function num(t){ return parseFloat(String(t).replace(',', '.')); }

/* ── Kennzahl des Tages ── */
function dayObject(d, weeks){
  if (d.type === 'rest') return { kind:'rest' };
  if (d.type === 'ride') return { kind:'ride' };

  if (d.type === 'own' && d.focus){
    const f = (weeks.focusDays || {})[d.focus];
    let best = 0, source = '', bestSteps = [];
    if (f) for (const b of (f.blocks||[])){
      if (b.prio === 'optional') continue;   // Layer/Accessory nie Tages-Kennzahl
      const li = (b.headers||[]).indexOf('Last');
      if (li < 0) continue;
      for (const r of (b.rows||[])){
        /* Zusatzlast ("+5 kg") ist keine Tages-Kennzahl — ein Gymnastics-Tag
           bekommt keine monumentale 5. */
        if (String(r[li]||'').trim().startsWith('+')) continue;
        const pl = parseLoad(r[li]);
        if (pl.kind === 'bar'){
          const m = Math.max.apply(null, pl.steps);
          if (m > best){ best = m; source = (r[0]||'').split('||')[0]; bestSteps = pl.steps; }
        }
      }
    }
    if (best) return { kind:'bar', kg:best, kgFrom:bestSteps.length > 1 ? Math.min.apply(null,bestSteps) : null, source, lead:true };
    return { kind:'bare' };
  }

  let bestEach = 0, bestCount = 2, bestName = '';
  for (const w of (d.wod||[])){
    for (const mv of (w.bewegungen||[])){
      const pl = parseLoad(mv.detail, { requireUnit:true });
      if (pl.kind === 'db' && pl.each > bestEach){ bestEach = pl.each; bestCount = pl.count; bestName = mv.name; }
      if (pl.kind === 'bar'){
        const m = Math.max.apply(null, pl.steps);
        if (m > bestEach){ return { kind:'bar', kg:m, source:mv.name }; }
      }
    }
  }
  if (bestEach) return { kind:'db', each:bestEach, count:bestCount, source:bestName };
  return { kind:'bare' };
}

/* ════════════════════════════════════════════════════════════════════
   Ansichten
   ════════════════════════════════════════════════════════════════════ */
const D = adapt(DATA);     // 3.0-Payload → Render-Form
V3 = D.V3;                 // Verdict-Overlay aus dem Payload
const week = D.weeks[0];   // keine Wochenwahl am Handy — nur die aktuelle Woche
let todayIso = new Date().toISOString().slice(0,10);
let currentFocus = null;

const elWeek = document.getElementById('viewWeek');
const elFocus = document.getElementById('viewFocus');
const elApp = document.getElementById('apparat');

const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
const BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>';

const TYPEWORD = { own:'Fokus', box:'Box', ride:'Rad', rest:'Ruhe' };

/* Dummy-Stub: Fokus-Charakter je Buchstabe. Wird im 3.0-Schema ein
   Datenfeld der Woche (focus-label), hier hart für W34. */
const FOCUS_LABEL = D.focusLabels || { A:'Oly-Fokus', B:'Gymnastics-Fokus' };

/* LoD der Wochenliste: Kurznamen statt voller Blocktitel. Dummy-Wörterbuch —
   im 3.0-Schema liefert die Registry den Kurznamen je ex_id. */
const SHORT = [
  [/bmu/i,'BMU'],[/toes|t2b/i,'T2B'],[/hspu/i,'HSPU'],[/pull-?up/i,'PU'],
  [/snatch/i,'Snatch'],[/ohs|overhead squat/i,'OHS'],[/core|hollow/i,'Core'],
  [/clean|jerk/i,'C&J'],[/deadlift|rdl/i,'RDL']
];
function shortName(t){
  for (const [re,s] of SHORT) if (re.test(t)) return s;
  return String(t).split(' ')[0];
}

function objUnit(o, d){
  if (o.kind === 'bar')  return o.source || 'Langhantel';
  if (o.kind === 'db')   return o.source || 'Kurzhanteln';
  if (o.kind === 'ride') return d && d.einheit && d.einheit !== '—' ? d.einheit : 'Radfahrt';
  if (o.kind === 'rest') return '';
  return d && d.einheit && d.einheit !== '—' ? d.einheit : 'Ohne Lastvorgabe';
}
function objFigure(o){
  if (o.kind === 'bar' && o.lead) return { n:fmt(o.kg), u:'kg', src:o.source };
  return null;
}

function headMarkup(d){
  /* Alle Teile der Einheit sind gleichrangig (Blöcke B/C/D sind keine
     Unterüberschrift); Klammerzusätze wie "(Stufe wiederholt)" sind
     Planungsprosa und entfallen. */
  let raw = (d.einheit && d.einheit !== '—') ? d.einheit : (d.type === 'rest' ? 'Ruhetag' : '');
  if (!raw) return '';
  raw = raw.replace(/\s*\([^)]*\)/g, '').replace(/\s+\+\s+/g, ' · ');
  return `<h1 class="today-what${raw.length > 30 ? ' is-l' : ''}">${esc(raw)}</h1>`;
}

function renderWeek(){
  const days = week.days || [];
  let idx = days.findIndex(d => d.isoDate === todayIso);
  if (idx < 0) idx = days.findIndex(d => d.isoDate >= todayIso);
  if (idx < 0) idx = 0;
  const today = days[idx];
  const o = dayObject(today, week);
  const fig = objFigure(o);

  elWeek.innerHTML = `
    <section class="today">
      <p class="today-when"><b>${esc(today.day)}</b>${today.focus ? ' · ' + esc(FOCUS_LABEL[today.focus] || 'Fokus ' + today.focus) : ''}</p>
      ${headMarkup(today)}

      ${fig ? `<div class="today-figure">
          <span class="load-num">${fig.n}</span>
          <span class="load-unit">${esc(fig.u)}</span>
        </div>` : ''}

      ${!today.focus && today.wod ? today.wod.map(wodMarkup).join('') : ''}
      ${!today.focus && !today.wod && today.sub ? `<p class="today-sub">${esc(today.sub)}</p>` : ''}

      ${today.focus ? `<button class="go" type="button" data-focus="${esc(today.focus)}">Zur Einheit ${ARROW}</button>` : ''}
    </section>

    <h2 class="week-head">Die Woche</h2>
    ${days.map(d => stripMarkup(d, d.isoDate === today.isoDate)).join('')}
  `;

  elWeek.querySelectorAll('[data-focus]').forEach(b =>
    b.addEventListener('click', () => showFocus(b.dataset.focus)));
  elWeek.querySelectorAll('.strip[data-nav="1"]').forEach(b =>
    b.addEventListener('click', () => showFocus(b.dataset.focus)));
  wireNote(elWeek);

  renderApparat('week', today);
}

/* Tagestyp als gezeichnetes Symbol, nicht als Wort — das Wort stünde doppelt
   zur Einheit rechts. Ein Strich-Icon je Kategorie, aria-label trägt den Typ. */
const TYPEICON = {
  own:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M6 7v10M18 7v10"/></svg>',
  box:  '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="7"/><path d="M12 14v-4M10 3h4"/></svg>',
  ride: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13h4l3-6 5 10 3-6h5"/></svg>',
  rest: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>'
};

function stripMarkup(d, isToday){
  const o = dayObject(d, week);
  const fig = objFigure(o);
  const nav = d.focus ? 1 : 0;

  /* Fokus-Tage in Kurzform: Fokus-Charakter + Kurznamen der Kernblöcke. */
  let unit;
  if (d.focus && (week.focusDays || {})[d.focus]){
    const f = week.focusDays[d.focus];
    const shorts = (f.blocks || []).filter(b => b.prio !== 'optional').map(b => shortName(b.kurz || b.title));
    unit = (FOCUS_LABEL[d.focus] ? FOCUS_LABEL[d.focus].replace('-Fokus','') + ' · ' : '') + [...new Set(shorts)].join(', ');
  } else {
    unit = (o.kind === 'rest' ? 'Ruhetag' : objUnit(o, d)).replace(/\s*\([^)]*\)/g, '');
  }

  /* Lastspanne statt Einzelzahl, kleinerer Grad. */
  let load = '';
  if (fig) load = (o.kgFrom
    ? `<span class="range">${fmt(o.kgFrom)}–${fig.n}</span>`
    : fig.n) + `<small>${esc(fig.u)}</small>`;

  return `<${nav ? 'button' : 'div'} class="strip${o.kind === 'rest' ? ' is-rest' : ''}${isToday ? ' is-today' : ''}" data-nav="${nav}"${nav ? ` data-focus="${esc(d.focus)}" type="button"` : ''}>
    <span class="strip-when">
      <span class="strip-day">${esc(d.day)}</span>
      <span class="strip-date">${esc(d.date)}</span>
    </span>
    <span class="strip-ico" role="img" aria-label="${esc(TYPEWORD[d.type] || '')}">${TYPEICON[d.type] || ''}</span>
    <span class="strip-unit">${esc(unit)}</span>
    <span class="strip-load${fig ? '' : ' is-word'}${o.kgFrom ? ' is-range' : ''}">${load}</span>
  </${nav ? 'button' : 'div'}>`;
}

/* ── Fokus-Tag ── */
function focusDate(letter){
  const d = (week.days || []).find(x => x.focus === letter);
  return d ? d.isoDate : '';
}

/* Verdict-Bereich je Block — ersetzt „Block erledigt". Jeder Block ist
   loggbar (auch Layer/Cool-down); ohne Registry-Eintrag fällt er auf eine
   generische ex_id zurück (Dummy — im 3.0-Schema kommt sie aus data.js). */
function vOverlay(iso, letter){
  if (!iso) return null;
  return (V3[iso] || {})[letter] || { ex_id:(iso + '-' + letter).toLowerCase(), cls:'loadable' };
}
const XMARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function verdictMarkup(iso, letter, exName){
  const ov = vOverlay(iso, letter);
  if (!ov) return '';
  const v = vstore.get(iso, ov.ex_id);
  const key = iso + '|' + ov.ex_id;

  if (v && v.verdict === 'hit'){
    return `<div class="verdict"><div class="vstate ok">${CHECK} Steht · ${vTime(v.at)}
      <button class="vundo" type="button" data-vundo="${key}">ändern</button></div></div>`;
  }
  if (v && v.verdict === 'miss'){
    const why = v.reason ? ' · ' + (v.reason === 'technik' ? 'Technik' : 'Last') : '';
    return `<div class="verdict"><div class="vstate no">Fail${why} · ${vTime(v.at)}
      <button class="vundo" type="button" data-vundo="${key}">ändern</button></div></div>`;
  }
  if (askOpen === key){
    return `<div class="verdict vask">
      <p class="vask-label">Woran lag's?</p>
      <div class="vbtns">
        <button class="vbtn is-word" type="button" data-vreason="technik" data-vkey="${key}">Technik</button>
        <button class="vbtn is-word" type="button" data-vreason="last" data-vkey="${key}">Last</button>
      </div></div>`;
  }
  const past = iso < todayIso;
  return `<div class="verdict">
    ${past ? `<p class="vopen">Offen · Nachtrag möglich</p>` : ''}
    <div class="vbtns">
      <button class="vbtn" type="button" data-vfail="${key}" data-vcls="${ov.cls}" aria-label="Fail: ${esc(exName)}">${XMARK}</button>
      <button class="vbtn v-done" type="button" data-vdone="${key}" aria-label="Done: ${esc(exName)}">${CHECK}</button>
    </div></div>`;
}
function vGet(iso, letter){
  const ov = vOverlay(iso, letter);
  return ov ? vstore.get(iso, ov.ex_id) : null;
}
function vTime(at){
  const d = new Date(at);
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}) + ' ' +
         d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}
function vHit(iso, letter){
  const ov = (V3[iso] || {})[letter];
  if (!ov) return false;
  const v = vstore.get(iso, ov.ex_id);
  return !!(v && v.verdict === 'hit');
}

function showFocus(letter){
  const f = (week.focusDays || {})[letter];
  if (!f) return;
  currentFocus = letter;
  const iso = f.isoDate || focusDate(letter);

  const blocks = (f.blocks || []).map((b, bi) => {
    const hi = {};
    (b.headers || []).forEach((h, i) => hi[h] = i);
    const single = (b.rows || []).length === 1;
    /* Superset-Kennung: Layer-Paare laufen im Wechsel — Rest gilt dem Paar,
       nicht der Einzelübung. Dummy-Heuristik; wird im 3.0-Schema ein Feld. */
    const isSuper = b.prio === 'optional' && (b.rows || []).length >= 2 && /layer/i.test(b.title || '');
    let rows = (b.rows || []).map(r => exerciseMarkup(r, hi, single, { noRest:isSuper })).join('');
    if (isSuper){
      const restVal = hi['Rest'] !== undefined ? (b.rows[0][hi['Rest']] || '') : '';
      rows = `<div class="superset">
        <p class="ss-label">Superset${restVal ? ` · Rest ${esc(restVal)} nach dem Paar` : ''}</p>
        ${rows}</div>`;
    }
    const v = vGet(iso, b.letter);
    const mainName = (b.rows && b.rows.length ? String(b.rows[b.rows.length-1][0]||'').split('||')[0] : b.title);
    /* Geloggte Blöcke klappen ein und werden grau — tiefschwarz bleibt nur,
       was noch offen ist. Titelzeile trägt das Verdict als Zeichen. */
    const logged = !!v;
    /* Zugeklappt: Zeit/Rang weggeblendet, das Verdict-Zeichen steht am
       rechten Rand neben dem Titel. */
    const vflag = !logged ? '' :
      `<span class="vflag ${v.verdict === 'hit' ? 'ok' : 'no'}">${v.verdict === 'hit' ? '✓' : '✕' + (v.reason ? ' ' + (v.reason === 'technik' ? 'Technik' : 'Last') : '')}</span>`;
    return `<section class="blk${logged ? ' is-logged' : ' is-open'}${v ? (v.verdict === 'hit' ? ' is-done' : ' is-failed') : ''}">
      <button class="blk-toggle" type="button" aria-expanded="${!logged}" data-blk="${bi}">
        <span class="blk-top">
          <span class="blk-letter">${esc(b.letter)}</span>
          <span class="blk-name">${esc(b.title)}</span>
          ${vflag}
        </span>
        ${logged ? '' : `<span class="blk-flags">
          ${b.min ? `<span>${esc(b.min)} min</span>` : ''}
          <span>${b.prio === 'optional' ? 'optional' : 'Kernblock'}</span>
        </span>`}
      </button>
      <div class="blk-body"${logged ? ' hidden' : ''}>${rows}
        ${verdictMarkup(iso, b.letter, mainName)}
      </div>
    </section>`;
  }).join('');

  const wods = (f.wod || []).map(wodMarkup).join('');

  /* Zeitangabe verdichtet: "40–65 min" statt Kern/Gesamt-Prosa. */
  let dauer = '';
  if (f.dauer){
    const k = parseInt(String(f.dauer.kern||'').replace(/\D+/g,'')) || null;
    const g = parseInt(String(f.dauer.gesamt||'').replace(/\D+/g,'')) || null;
    dauer = k && g ? `${k}–${g} min` : (f.dauer.gesamt || f.dauer.kern || '');
  }

  elFocus.innerHTML = `
    <button class="back" type="button" id="backBtn">${BACK} Zur Woche</button>
    <header class="focus-head">
      <p class="focus-when">${esc(f.date || '')}</p>
      <h1 class="focus-title">${esc(f.title)}</h1>
      ${dauer ? `<p class="focus-dauer"><b>${esc(dauer)}</b></p>` : ''}
    </header>
    ${blocks}${wods}
    ${noteMarkup(iso, f.date || '')}
  `;

  elFocus.querySelector('#backBtn').addEventListener('click', showWeek);
  elFocus.querySelectorAll('.blk-toggle').forEach(t => t.addEventListener('click', () => {
    const s = t.closest('.blk');
    const open = t.getAttribute('aria-expanded') === 'true';
    t.setAttribute('aria-expanded', String(!open));
    s.classList.toggle('is-open', !open);
    s.querySelector('.blk-body').hidden = open;
  }));
  elFocus.querySelectorAll('.note-handle').forEach(h => h.addEventListener('click', () => {
    h.setAttribute('aria-expanded', h.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
  }));
  wireNote(elFocus);
  wireVerdicts(elFocus, letter);

  elWeek.hidden = true; elFocus.hidden = false;
  if (!showFocus.rerender) window.scrollTo(0, 0);
  renderApparat('focus', f);
}

/* Verdict-Taps: Stub speichern, dann Ansicht mit Serverstand neu zeichnen
   (Scrollposition bleibt). */
function wireVerdicts(root, letter){
  const blkIndex = el => Array.from(root.querySelectorAll('.blk')).indexOf(el.closest('.blk'));
  const rerender = (fromIdx) => {
    const y = window.scrollY;
    showFocus.rerender = true; showFocus(letter); showFocus.rerender = false;
    window.scrollTo(0, y);
    /* Nach dem Abhaken rückt der nächste offene Block in die Mitte. */
    if (fromIdx !== undefined){
      const blks = Array.from(elFocus.querySelectorAll('.blk'));
      const next = blks.slice(fromIdx + 1).find(b => !b.classList.contains('is-logged'))
                || blks.find(b => !b.classList.contains('is-logged'));
      if (next) next.scrollIntoView({ behavior:'smooth', block:'center' });
    }
  };
  root.querySelectorAll('[data-vdone]').forEach(b => b.addEventListener('click', async () => {
    const [iso, ex] = b.dataset.vdone.split('|'); const i = blkIndex(b); b.disabled = true;
    await vstore.save(iso, ex, 'hit'); askOpen = null; rerender(i);
  }));
  root.querySelectorAll('[data-vfail]').forEach(b => b.addEventListener('click', async () => {
    const key = b.dataset.vfail; const [iso, ex] = key.split('|'); const i = blkIndex(b);
    if (b.dataset.vcls === 'technical'){ askOpen = key; rerender(); }
    else { b.disabled = true; await vstore.save(iso, ex, 'miss'); rerender(i); }
  }));
  root.querySelectorAll('[data-vreason]').forEach(b => b.addEventListener('click', async () => {
    const [iso, ex] = b.dataset.vkey.split('|'); const i = blkIndex(b); b.disabled = true;
    await vstore.save(iso, ex, 'miss', b.dataset.vreason); askOpen = null; rerender(i);
  }));
  root.querySelectorAll('[data-vundo]').forEach(b => b.addEventListener('click', async () => {
    const [iso, ex] = b.dataset.vundo.split('|');
    await vstore.clear(iso, ex); askOpen = null; rerender();
  }));
}

function exerciseMarkup(r, hi, single, opts){
  opts = opts || {};
  const rawName = r[hi['Übung']] || '';
  const parts = rawName.split('||');
  const sets = hi['Sets × Reps'] !== undefined ? r[hi['Sets × Reps']] : (hi['Dauer'] !== undefined ? r[hi['Dauer']] : '');
  const last = hi['Last'] !== undefined ? r[hi['Last']] : '';
  const pl = parseLoad(last);

  /* Eine Zeile: Rep-Schema · Gewicht. Zusätze ("unbroken", "aufsteigend")
     stehen darunter, nicht daneben. Nur der mehrstufige Lastaufbau behält
     den Teststreifen als eigene Zeile je Last. */
  const setParts = String(sets || '').split('||');
  let setsMain = setParts[0].trim();
  let setsSub = (setParts[1] || '').trim();
  const sm = setsMain.match(/^(.+?)\s+((?!sec\b|min\b)[A-Za-zÄÖÜäöü][\wÄÖÜäöüß-]*)$/);
  if (sm){ setsMain = sm[1]; setsSub = setsSub ? sm[2] + ' · ' + setsSub : sm[2]; }

  let loadInline = '', ladder = '';
  if (pl.kind === 'bar'){
    const target = Math.max.apply(null, pl.steps);
    if (pl.steps.length > 1){
      ladder = `<div class="teststrip" role="list" aria-label="Lastaufbau, Zielsatz ${fmt(target)} Kilo">` +
        pl.steps.map((kg, i) =>
          `<div class="ts${kg === target ? ' is-target' : ''}" role="listitem"
                style="--z:${(i + 1) / pl.steps.length}">
             <span class="ts-kg">${fmt(kg)}</span>
           </div>`).join('') + `</div>`;
    } else {
      loadInline = `${fmt(target)} kg`;
    }
  } else if (pl.kind === 'db'){
    loadInline = `${pl.count} × ${fmt(pl.each)}${pl.eachTo ? '–' + fmt(pl.eachTo) : ''} kg`;
  } else if (pl.kind === 'bw'){
    loadInline = 'BW';
  } else if (pl.kind === 'text'){
    loadInline = pl.text;
    /* "Band" ohne Stärke ist keine Vorgabe — Dummy-Fix; die Bandfarbe gehört
       ins 3.0-target (Registry/mode), nicht in Prosa. */
    if (/^band$/i.test(loadInline)) loadInline = 'rotes Band';
  }

  const meta = [];
  const metaKeys = opts.noRest ? ['Tempo','RPE'] : ['Tempo','Rest','Pause','RPE'];
  metaKeys.forEach(k => {
    if (hi[k] !== undefined && r[hi[k]] && r[hi[k]] !== '—') meta.push(`<span><b>${k}</b>${esc(r[hi[k]])}</span>`);
  });
  const note = hi['Note'] !== undefined ? r[hi['Note']] : '';

  return `<article class="ex${single ? ' is-single' : ''}">
    ${single
      ? (parts[1] ? `<p class="ex-qual">${esc(parts[1])}</p>` : '')
      : `<h3 class="ex-name">${esc(parts[0])}${parts[1] ? `<small>${esc(parts[1])}</small>` : ''}</h3>`}
    ${setsMain ? (loadInline && loadInline.length <= 12
      ? `<p class="ex-sets"><b class="reps">${esc(setsMain)} @ ${esc(loadInline)}</b></p>`
      : `<p class="ex-sets"><b class="reps">${esc(setsMain)}</b>${loadInline ? `<span class="xload">· ${esc(loadInline)}</span>` : ''}</p>`) : ''}
    ${setsSub ? `<p class="ex-sub">${esc(setsSub)}</p>` : ''}
    ${ladder}
    ${meta.length ? `<p class="ex-meta">${meta.join('')}</p>` : ''}
    ${note ? `<button class="note-handle" type="button" aria-expanded="false">Begründung ${CHEV}</button><p class="ex-note">${esc(note)}</p>` : ''}
  </article>`;
}

function normStruct(t){
  return String(t || '').replace(/^every\s+/i, 'E').replace(/\s*×\s*/g, ' × ');
}
function wodMarkup(w){
  const mvs = (w.bewegungen || []).map(mv => {
    return `<div class="mv">
      <span class="mv-reps">${esc(mv.reps)}</span>
      <span>
        <span class="mv-name">${esc(mv.name)}</span>
        ${mv.detail ? `<span class="mv-detail">${esc(mv.detail)}</span>` : ''}
      </span>
    </div>`;
  }).join('');
  return `<section class="wod">
    <h2 class="wod-struct">${esc(normStruct(w.struktur))}</h2>
    <p class="wod-format">${[w.format, w.level, w.rpe].filter(Boolean).map(esc).join(' · ')}</p>
    ${mvs}
  </section>`;
}

function noteMarkup(isoDate, dayLabel){
  /* Kein Gesamtsession-Rating mehr — das Verdict je Übung trägt die
     Bewertung; hier bleibt nur die Notiz. */
  return `<section class="note-block" data-date="${esc(isoDate || '')}">
    <h2 class="note-h">Notiz</h2>
    <textarea class="note-ta" aria-label="Notiz zur Einheit" placeholder="Tatsächliche Lasten, Abbrüche, was sich angefühlt hat wie."></textarea>
    <div class="note-foot">
      <button class="note-save" type="button">Eintragen</button>
      <span class="note-state"></span>
    </div>
  </section>`;
}

function wireNote(root){
  const block = root.querySelector('.note-block');
  if (!block) return;
  const save = block.querySelector('.note-save');
  const state = block.querySelector('.note-state');
  save.addEventListener('click', () => {
    state.className = 'note-state';
    state.textContent = 'Wird eingetragen …';
    fetch('../save_note.php', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        session_key: block.dataset.date,
        note_date: block.dataset.date,
        note_text: block.querySelector('.note-ta').value,
        session_feel: 0
      })
    })
      .then(r => { if (!r.ok) throw new Error(r.status); state.textContent = 'Eingetragen.'; })
      .catch(() => {
        state.className = 'note-state err';
        state.textContent = 'Kein Backend in dieser Vorschau — nichts gespeichert.';
      });
  });
}

function showWeek(){
  currentFocus = null;
  elFocus.hidden = true; elWeek.hidden = false;
  window.scrollTo(0, 0);
}

/* ── Apparat (nur Desktop-Randspalte) ── */
function renderApparat(kind, ctx){
  let body = '';
  if (kind === 'week' && ctx && ctx.note){
    body = `<p>${esc(ctx.note)}</p><p class="src">coach/state.json · Wochenplan ${esc(week.id)}</p>`;
  } else if (kind === 'focus' && ctx){
    body = `${ctx.intro ? `<p>${stripHtml(ctx.intro)}</p>` : ''}
      ${ctx.dauer && ctx.dauer.hinweis ? `<p class="src">${esc(ctx.dauer.hinweis)}</p>` : ''}`;
  }
  elApp.innerHTML = body ? `<h2>Beleg</h2>${body}` : '';
}

/* ── Backend-Setup: Long-Press (1,2 s) auf die Kopf-Rail.
   Probe gegen save_verdict.php ohne Payload: 401 = Secret falsch,
   400 = Secret akzeptiert (Validierung greift erst nach Auth) —
   es wird nie ein echter Verdict geschrieben. ── */
(function(){
  const rail = document.querySelector('.rail');
  let timer = null, startY = 0, pop = null;

  function close(){ if (pop){ pop.remove(); pop = null; } }

  function open(){
    if (pop) return;
    const isHttp = localStorage.getItem('v3_backend') === 'http';
    pop = document.createElement('div');
    pop.className = 'setup-pop';
    pop.innerHTML =
      '<div class="setup-row">' +
        '<span class="setup-label">Verdict-Backend</span>' +
        '<span class="setup-state">' + (isHttp ? 'Server' : 'Stub · lokal') + '</span>' +
        '<button class="setup-x" aria-label="Schließen">✕</button>' +
      '</div>' +
      '<div class="setup-form">' +
        '<input class="setup-in" type="password" placeholder="Secret" ' +
          'autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<button class="setup-go">Aktivieren</button>' +
        (isHttp ? '<button class="setup-off">Stub</button>' : '') +
      '</div>' +
      '<div class="setup-msg" hidden></div>';
    document.body.appendChild(pop);

    const input = pop.querySelector('.setup-in');
    const msgEl = pop.querySelector('.setup-msg');
    const msg = t => { msgEl.hidden = false; msgEl.textContent = t; };

    pop.querySelector('.setup-x').addEventListener('click', close);
    const off = pop.querySelector('.setup-off');
    if (off) off.addEventListener('click', () => {
      localStorage.removeItem('v3_backend');
      location.reload();
    });
    pop.querySelector('.setup-go').addEventListener('click', async () => {
      const secret = input.value.trim();
      if (!secret){ msg('Secret eingeben.'); return; }
      msg('Prüfe …');
      try {
        const r = await fetch(EP_SAVE, { method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ secret }) });
        if (r.status === 401){ msg('Secret falsch.'); return; }
        if (r.status !== 400){ msg('Server antwortet unerwartet (' + r.status + ').'); return; }
        localStorage.setItem('v3_secret', secret);
        localStorage.setItem('v3_backend', 'http');
        location.reload();
      } catch(e){ msg('Keine Verbindung zum Server.'); }
    });
    input.focus();
  }

  function cancel(){ if (timer){ clearTimeout(timer); timer = null; } }
  rail.addEventListener('pointerdown', e => {
    startY = e.clientY;
    cancel();
    timer = setTimeout(open, 1200);
  });
  rail.addEventListener('pointermove', e => {
    if (Math.abs(e.clientY - startY) > 12) cancel();
  });
  rail.addEventListener('pointerup', cancel);
  rail.addEventListener('pointercancel', cancel);
  rail.addEventListener('contextmenu', e => e.preventDefault());
})();

/* ── Start ── Verdict-Cache (Serverstand) VOR dem ersten Render laden. */
(async function start(){
  const days = week.days || [];
  const from = days.length ? days[0].isoDate : '';
  const to = days.length ? days[days.length - 1].isoDate : '';
  await vstore.hydrate(from, to);

  document.getElementById('railWeek').textContent = week.id.replace('-', ' ');
  document.getElementById('railMeso').textContent = week.meso || week.label || '';
  renderWeek();

  /* Deep-Links: ?focus=A&theme=dark — Woche ist fix (keine Wochenwahl). */
  const q = new URLSearchParams(location.search);
  const t = q.get('theme');
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  const f = q.get('focus');
  if (f) showFocus(f);
})();
</script>
